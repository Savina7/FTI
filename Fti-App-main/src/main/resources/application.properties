spring.application.name=ftiApp
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.username=FTIAPP
spring.datasource.password=1

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Flyway - menaxhon strukturen e DB
spring.flyway.enabled=true
spring.flyway.schemas=FTIAPP
spring.flyway.default-schema=FTIAPP
spring.flyway.locations=classpath:db/migration
# Meqe tabela ekzistojne, baseline-on-migrate e kalon V1 pa e ekzekutuar
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=false
spring.flyway.repair-on-migrate=true

# Hibernate nuk ndryshon strukturen - Flyway e menaxhon ate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.default_schema=FTIAPP
spring.jpa.properties.hibernate.format_sql=true

# Logging per debug
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.Savina.ftiApp=DEBUG

server.port=8080

# ─── UTF-8 Encoding (per karakteret shqipe: ë, ç, etj.) ──────────────────────
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.mandatory-file-encoding=UTF-8

# Auto-reload me DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.thymeleaf.cache=false

# ─── SMTP Email (Gmail) ───────────────────────────────────────────────────────
# REPLACE with your Gmail address and App Password (not regular password)
# Generate App Password: Google Account > Security > 2FA > App Passwords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=Username
spring.mail.password=password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# ─── Verification code expiry ─────────────────────────────────────────────────
app.verification.expiry-minutes=15