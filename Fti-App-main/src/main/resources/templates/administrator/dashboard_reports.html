<!doctype html>
<html lang="sq">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Admin FTI</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/styleadm.css" />
  <!-- Auth Interceptor: shton JWT header automatikisht ne çdo fetch() -->
  <script src="/js/auth-interceptor.js"></script>
</head>

<body>
  <div id="wrapper">
    <!-- ================= SIDEBAR ================= -->
    <aside id="sidebar-wrapper">
      <div>
        <!-- Logo -->
        <div class="sidebar-heading px-3 py-3 border-bottom text-center">
          <a href="/dashboard_reports" class="d-block text-decoration-none">
            <img src="/images/ftilogo.png" alt="FTI Logo" class="sidebar-logo" />
          </a>
        </div>

        <!-- Menyte -->
        <div class="list-group list-group-flush py-2">
          <a href="/dashboard_reports" class="list-group-item list-group-item-action px-4 py-3 active">
            Dashboard
          </a>
          <a href="/std" class="list-group-item list-group-item-action px-4 py-3">
            Studentet
          </a>
          <a href="/adm" class="list-group-item list-group-item-action px-4 py-3">
            Pedagoget
          </a>
          <a href="/lende" class="list-group-item list-group-item-action px-4 py-3">
            Lendet
          </a>
          <a href="/tc" class="list-group-item list-group-item-action px-4 py-3">
            Alokimi
          </a>
          <a href="/course_schedule" class="list-group-item list-group-item-action px-4 py-3">
            Orare
          </a>
        </div>
      </div>

      <!-- Logout -->
      <div class="p-3 border-top">
        <a href="/" class="btn-logout d-flex align-items-center gap-2 px-3 py-2 rounded-2">
          <i class="bi bi-box-arrow-right"></i>
          <span>Logout</span>
        </a>
      </div>
    </aside>

    <!-- ================= MAIN CONTENT ================= -->
    <div id="page-content-wrapper">
      <!-- Header Top Bar -->
      <header class="navbar navbar-light bg-white border-bottom px-4 py-2 d-flex justify-content-between">
        <h6 class="mb-0 fw-bold text-dark"></h6>
        <div class="d-flex align-items-center gap-3">
          <div class="text-end d-none d-sm-block">
            <span class="d-block fw-bold small text-dark">Administrator</span>
            <span class="d-block admin-subtitle">FTI - Fakulteti Teknologjise Informacionit</span>
          </div>
        </div>
      </header>

      <div id="page-wrapper">
        <!-- Header i Dashboard -->
        <div class="mb-4 text-center">
          <h4 class="fw-bold mb-1"></h4>
          <p class="text-muted small mb-0"></p>
        </div>

        <!-- STATISTIKAT KRYESORE (22PX / 25PX PERFECT BALANCED) -->
        <div class="d-flex justify-content-center my-4">
          <div class="card border-0 shadow-sm rounded-4 bg-white" style="max-width: 500px; width: 100%;">
            <div class="card-body px-4 py-3">

              <!-- 1. Studente -->
              <div class="d-flex justify-content-between align-items-center py-3 border-bottom"
                style="border-color: #f1f5f9 !important;">
                <span
                  style="font-size: 22px !important; font-weight: 500 !important; color: #0f172a !important;">Studente</span>
                <span style="font-size: 25px !important; font-weight: 600 !important; color: #0f172a !important;"
                  id="countStudents">0</span>
              </div>

              <!-- 2. Pedagoge -->
              <div class="d-flex justify-content-between align-items-center py-3 border-bottom"
                style="border-color: #f1f5f9 !important;">
                <span
                  style="font-size: 22px !important; font-weight: 500 !important; color: #0f172a !important;">Pedagoge</span>
                <span style="font-size: 25px !important; font-weight: 600 !important; color: #0f172a !important;"
                  id="countProfessors">0</span>
              </div>

              <!-- 3. Lende -->
              <div class="d-flex justify-content-between align-items-center py-3 border-bottom"
                style="border-color: #f1f5f9 !important;">
                <span
                  style="font-size: 22px !important; font-weight: 500 !important; color: #0f172a !important;">Lende</span>
                <span style="font-size: 25px !important; font-weight: 600 !important; color: #0f172a !important;"
                  id="countCourses">0</span>
              </div>

              <!-- 4. Programe -->
              <div class="d-flex justify-content-between align-items-center py-3">
                <span
                  style="font-size: 22px !important; font-weight: 500 !important; color: #0f172a !important;">Programe</span>
                <span style="font-size: 25px !important; font-weight: 600 !important; color: #0f172a !important;"
                  id="countPrograms">0</span>
              </div>

            </div>
          </div>
        </div>

      </div>
      <!-- /page-wrapper -->
    </div>
    <!-- /page-content-wrapper -->
  </div>
  <!-- /wrapper -->

  <!-- SCRIPTS -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
        const _jwt = localStorage.getItem('jwtToken'); const _h = _jwt ? { 'Authorization': 'Bearer ' + _jwt } : {};
    $(document).ready(function () {
      loadDashboardCounts();
    });

    async function loadDashboardCounts() {
      try {
        const [resStd, resProf, resCourses, resProg] = await Promise.all([
          fetch('/api/admin/students'),
          fetch('/api/admin/professors'),
          fetch('/api/admin/courses'),
          fetch('/api/admin/courses/programs', { headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('jwtToken') || '') } })
        ]);

        if (resStd.ok) {
          const stds = await resStd.json();
          $('#countStudents').text(stds ? stds.length : 0);
        }
        if (resProf.ok) {
          const profs = await resProf.json();
          $('#countProfessors').text(profs ? profs.length : 0);
        }
        if (resCourses.ok) {
          const courses = await resCourses.json();
          $('#countCourses').text(courses ? courses.length : 0);
        }
        if (resProg.ok) {
          const progs = await resProg.json();
          $('#countPrograms').text(progs ? progs.length : 0);
        }
      } catch (err) {
        console.error("Gabim gjate leximit te statistikave te dashboard:", err);
      }
    }
  </script>
</body>

</html>
