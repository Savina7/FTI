                <!-- RESULT SECTION: COMPACT BOX WITH ONLY NAME & DOWNLOAD BUTTON -->

                    <div class="card border-0 shadow-sm rounded-3 p-2 text-center bg-white">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let allProfessors = [];
        let allEvidenca = [];
        let selectedProf = null;

        $(document).ready(function () {
            loadRealProfessors();
            loadEvidenca();

            $('#filterDepartamenti').on('change', function () {
                populateProfessors();
                $('#resultSection').hide();
            });

            $('#filterPedagogu').on('change', function () {
                $('#resultSection').hide();
            });

            $('#filterSemestri').on('change', function () {
                $('#resultSection').hide();
            });

            $('#btnFiltro').on('click', function () {
                handleKerko();
            });

            $('#btnReset').on('click', function () {
                $('#filterDepartamenti').prop('selectedIndex', 0);
                $('#filterSemestri').val('1');
                populateProfessors();
                $('#resultSection').hide();
                selectedProf = null;
            });
        });

        /* ---------- 1. NGARKIMI I TE GJITHE PEDAGOGEVE NGA DB + DEPARTAMENTET ---------- */
        async function loadRealProfessors() {
            const depSelect = $('#filterDepartamenti');
            depSelect.empty();
            depSelect.prop('disabled', true);

            const token = localStorage.getItem('jwtToken') || '';
            const authHeader = token ? { 'Authorization': 'Bearer ' + token } : {};

            try {
                // 1. Merr departamentet direkt nga endpoint-i i dedikuar
                try {
                    const resDept = await fetch('/api/admin/professors/departamentet', { headers: authHeader });
                    if (resDept.ok) {
                        const depts = await resDept.json();
                        depSelect.empty();
                        depSelect.prop('disabled', false);
                        const uniqueDepts = [...new Set(depts)].filter(Boolean).sort();
                        uniqueDepts.forEach(d => {
                            depSelect.append(new Option(d, d));
                        });
                        console.log('[Evidenca] Departamentet nga API:', uniqueDepts);
                    }
                } catch (eDept) {
                    console.warn('[Evidenca] Gabim marrje departamentesh:', eDept);
                }

                // 2. Merr listen e pedagogeve nga DB
                const response = await fetch('/api/admin/professors', { headers: authHeader });
                console.log('[Evidenca] Status i API professors:', response.status);

                if (!response.ok) {
                    console.error('[Evidenca] Gabim API professors:', response.status);
                    depSelect.prop('disabled', false);
                    return;
                }

                const data = await response.json();
                console.log('[Evidenca] Pedagoget e marre nga API:', data.length);

                if (Array.isArray(data) && data.length > 0) {
                    allProfessors = data;

                    // Nese departamentet nuk u mbushen nga hapi 1, nxirri nga pedagoget
                    if (depSelect.children('option').length === 0) {
                        depSelect.empty();
                        depSelect.prop('disabled', false);

                        const uniqueDepts = [...new Set(
                            allProfessors.map(p => (p.department || '').trim()).filter(Boolean)
                        )].sort();

                        uniqueDepts.forEach(d => {
                            depSelect.append(new Option(d, d));
                        });
                    }

                    // Mbush pedagoget per departamentin e pare te perzgjedhur
                    populateProfessors();
                } else {
                    depSelect.prop('disabled', false);
                }

            } catch (err) {
                console.error('[Evidenca] Gabim fetch:', err);
                depSelect.prop('disabled', false);
            }
        }

        /* ---------- 2. MBUSHJA E PEDAGOGEVE SIPAS DEPARTAMENTIT ---------- */
        function populateProfessors() {
            const selDep = ($('#filterDepartamenti').val() || '').trim();
            const profSelect = $('#filterPedagogu');
            profSelect.empty();

            let list = Array.isArray(allProfessors) ? [...allProfessors] : [];

            // Filter sipas departamentit
            if (selDep) {
                list = list.filter(p => (p.department || '').trim() === selDep);
            }

            list.sort((a, b) => ((a.emri || '') + ' ' + (a.mbiemri || '')).localeCompare((b.emri || '') + ' ' + (b.mbiemri || '')));

            list.forEach(p => {
                const fullName = `${p.emri || ''} ${p.mbiemri || ''}`.trim();
                profSelect.append(new Option(fullName, p.id));
            });
        }

        /* ---------- 4. NGARKIMI I EVIDENCES / ALOKIMEVE ---------- */
        function formatSingleGroup(name) {
            if (!name) return '';
            let s = String(name).trim();
            if (/^t[eë]\s+gjith[eë]/i.test(s) || /all/i.test(s)) return 'Të gjithë';
            return s.replace(/^grupi?\s+/i, '').trim();
        }

        function formatGroupName(raw) {
            if (!raw) return 'A';
            let s = String(raw).trim();
            if (/^t[eë]\s+gjith[eë]/i.test(s) || /all/i.test(s)) return 'Të gjithë';
            let parts = s.split(',').map(p => formatSingleGroup(p)).filter(Boolean);
            let result = [...new Set(parts)].join(', ');
            return result || 'A';
        }

        function mergeGroups(g1, g2) {
            if (!g1) return g2 || '';
            if (!g2) return g1 || '';
            const all = [...g1.split(','), ...g2.split(',')].map(s => formatSingleGroup(s)).filter(Boolean);
            return [...new Set(all)].join(', ');
        }

        async function loadEvidenca() {
            const parseGroups = (assignment) => {
                if (!assignment) return { groups: [], count: 0, text: '' };
                let grps = [];
                if (Array.isArray(assignment.classNames) && assignment.classNames.length > 0) {
                    grps = assignment.classNames.map(s => formatSingleGroup(s)).filter(Boolean);
                } else if (assignment.classGroup) {
                    grps = assignment.classGroup.split(',').map(s => formatSingleGroup(s)).filter(Boolean);
                }
                const count = grps.length > 0 ? grps.length : 1;
                const text = grps.length > 0 ? grps.join(', ') : (formatSingleGroup(assignment.classGroup) || 'A');
                return { groups: grps, count, text };
            };

            try {
                const token = localStorage.getItem('jwtToken') || '';
                const authHeader = token ? { 'Authorization': 'Bearer ' + token } : {};
                const res = await fetch('/api/admin/teaching-courses', { headers: authHeader });
                if (!res.ok) return;
                const allocations = await res.json();
                if (!Array.isArray(allocations)) return;
                allEvidenca = [];

                allocations.forEach(alloc => {
                    if (!alloc) return;
                    const courseId = alloc.courseId;
                    const courseEmri = alloc.courseEmri;
                    const programEmri = alloc.programName || '';
                    const semester = String(alloc.semester || '1').trim();
                    const kredite = alloc.courseKredite || 6;
                    const studyYear = alloc.studyYear;
                    const krediteLeksion = alloc.krediteLeksion;
                    const krediteSeminar = alloc.krediteSeminar;
                    const krediteLaborator = alloc.krediteLaborator;
                    const krediteDetyreKursi = alloc.krediteDetyreKursi;
                    const kreditePraktike = alloc.kreditePraktike;

                    // Check Lecture
                    if (alloc.lectureProfessor && alloc.lectureProfessor.professorId) {
                        const pId = alloc.lectureProfessor.professorId;
                        let existing = allEvidenca.find(e => e.professorId === pId && e.courseId === courseId);
                        if (!existing) {
                            existing = {
                                professorId: pId,
                                courseId,
                                courseEmri,
                                programEmri,
                                semester,
                                kredite,
                                krediteLeksion,
                                krediteSeminar,
                                krediteLaborator,
                                krediteDetyreKursi,
                                kreditePraktike,
                                studyYear,
                                oreLeksion: 0,
                                oreSeminar: 0,
                                oreLaborator: 0,
                                oreDetyreKursi: 0,
                                orePraktike: 0,
                                grupiLeksion: '',
                                grupiSeminar: '',
                                grupiLaborator: '',
                                grupiDetyreKursi: '',
                                grupiPraktike: ''
                            };
                            allEvidenca.push(existing);
                        }
                        const parsedL = parseGroups(alloc.lectureProfessor);
                        const baseLecHours = alloc.lectureHours != null ? alloc.lectureHours : (alloc.totalHours || 30);
                        existing.oreLeksion = (existing.oreLeksion || 0) + baseLecHours;
                        existing.grupiLeksion = 'Të gjithë';
                    }

                    // Check Seminar
                    if (Array.isArray(alloc.seminarProfessors)) {
                        alloc.seminarProfessors.forEach(sp => {
                            if (!sp || !sp.professorId) return;
                            const pId = sp.professorId;
                            let existing = allEvidenca.find(e => e.professorId === pId && e.courseId === courseId);
                            if (!existing) {
                                existing = {
                                    professorId: pId,
                                    courseId,
                                    courseEmri,
                                    programEmri,
                                    semester,
                                    kredite,
                                    krediteLeksion,
                                    krediteSeminar,
                                    krediteLaborator,
                                    krediteDetyreKursi,
                                    kreditePraktike,
                                    studyYear,
                                    oreLeksion: 0,
                                    oreSeminar: 0,
                                    oreLaborator: 0,
                                    oreDetyreKursi: 0,
                                    orePraktike: 0,
                                    grupiLeksion: '',
                                    grupiSeminar: '',
                                    grupiLaborator: '',
                                    grupiDetyreKursi: '',
                                    grupiPraktike: ''
                                };
                                allEvidenca.push(existing);
                            }
                            const parsedS = parseGroups(sp);
                            const baseSemHours = alloc.seminarHours != null ? alloc.seminarHours : (alloc.totalHours || 30);
                            const totalSem = baseSemHours * parsedS.count;
                            existing.oreSeminar = (existing.oreSeminar || 0) + totalSem;
                            existing.grupiSeminar = existing.grupiSeminar ? mergeGroups(existing.grupiSeminar, parsedS.text) : parsedS.text;
                        });
                    }

                    // Check Lab
                    if (Array.isArray(alloc.labProfessors)) {
                        alloc.labProfessors.forEach(lp => {
                            if (!lp || !lp.professorId) return;
                            const pId = lp.professorId;
                            let existing = allEvidenca.find(e => e.professorId === pId && e.courseId === courseId);
                            if (!existing) {
                                existing = {
                                    professorId: pId,
                                    courseId,
                                    courseEmri,
                                    programEmri,
                                    semester,
                                    kredite,
                                    krediteLeksion,
                                    krediteSeminar,
                                    krediteLaborator,
                                    krediteDetyreKursi,
                                    kreditePraktike,
                                    studyYear,
                                    oreLeksion: 0,
                                    oreSeminar: 0,
                                    oreLaborator: 0,
                                    oreDetyreKursi: 0,
                                    orePraktike: 0,
                                    grupiLeksion: '',
                                    grupiSeminar: '',
                                    grupiLaborator: '',
                                    grupiDetyreKursi: '',
                                    grupiPraktike: ''
                                };
                                allEvidenca.push(existing);
                            }
                            const parsedLab = parseGroups(lp);
                            const baseLabHours = alloc.labHours != null ? alloc.labHours : 15;
                            const totalLab = baseLabHours * parsedLab.count;
                            existing.oreLaborator = (existing.oreLaborator || 0) + totalLab;
                            existing.grupiLaborator = existing.grupiLaborator ? mergeGroups(existing.grupiLaborator, parsedLab.text) : parsedLab.text;
                        });
                    }

                    // Check CourseWork / Detyra Kursi
                    const cwList = alloc.courseWorkProfessors || alloc.detyreKursiProfessors;
                    if (Array.isArray(cwList)) {
                        cwList.forEach(cwp => {
                            if (!cwp || !cwp.professorId) return;
                            const pId = cwp.professorId;
                            let existing = allEvidenca.find(e => e.professorId === pId && e.courseId === courseId);
                            if (!existing) {
                                existing = {
                                    professorId: pId,
                                    courseId,
                                    courseEmri,
                                    programEmri,
                                    semester,
                                    kredite,
                                    krediteLeksion,
                                    krediteSeminar,
                                    krediteLaborator,
                                    krediteDetyreKursi,
                                    kreditePraktike,
                                    studyYear,
                                    oreLeksion: 0,
                                    oreSeminar: 0,
                                    oreLaborator: 0,
                                    oreDetyreKursi: 0,
                                    orePraktike: 0,
                                    grupiLeksion: '',
                                    grupiSeminar: '',
                                    grupiLaborator: '',
                                    grupiDetyreKursi: '',
                                    grupiPraktike: ''
                                };
                                allEvidenca.push(existing);
                            }
                            const parsedCw = parseGroups(cwp);
                            const baseCwHours = alloc.courseWorkHours != null ? alloc.courseWorkHours : 5;
                            const totalCw = baseCwHours * parsedCw.count;
                            existing.oreDetyreKursi = (existing.oreDetyreKursi || 0) + totalCw;
                            existing.grupiDetyreKursi = existing.grupiDetyreKursi ? mergeGroups(existing.grupiDetyreKursi, parsedCw.text) : parsedCw.text;
                        });
                    }

                    // Check Practice
                    if (Array.isArray(alloc.practiceProfessors)) {
                        alloc.practiceProfessors.forEach(pp => {
                            if (!pp || !pp.professorId) return;
                            const pId = pp.professorId;
                            let existing = allEvidenca.find(e => e.professorId === pId && e.courseId === courseId);
                            if (!existing) {
                                existing = {
                                    professorId: pId,
                                    courseId,
                                    courseEmri,
                                    programEmri,
                                    semester,
                                    kredite,
                                    krediteLeksion,
                                    krediteSeminar,
                                    krediteLaborator,
                                    krediteDetyreKursi,
                                    kreditePraktike,
                                    studyYear,
                                    oreLeksion: 0,
                                    oreSeminar: 0,
                                    oreLaborator: 0,
                                    oreDetyreKursi: 0,
                                    orePraktike: 0,
                                    grupiLeksion: '',
                                    grupiSeminar: '',
                                    grupiLaborator: '',
                                    grupiDetyreKursi: '',
                                    grupiPraktike: ''
                                };
                                allEvidenca.push(existing);
                            }
                            const parsedPr = parseGroups(pp);
                            const basePrHours = alloc.practiceHours != null ? alloc.practiceHours : 10;
                            const totalPr = basePrHours * parsedPr.count;
                            existing.orePraktike = (existing.orePraktike || 0) + totalPr;
                            existing.grupiPraktike = existing.grupiPraktike ? mergeGroups(existing.grupiPraktike, parsedPr.text) : parsedPr.text;
                        });
                    }
                });
            } catch (e) { console.error('Error loading evidenca:', e); }
        }

        /* ---------- 5. HANDLE KERKO ---------- */
        function handleKerko() {
            const selProfId = $('#filterPedagogu').val();
            const selDept = ($('#filterDepartamenti').val() || '').trim().toLowerCase();

            if (!selProfId && !selDept) {
                alert('Ju lutem zgjidhni departamentin ose pedagogun para se të kërkoni.');
                return;
            }

            let p = null;
            if (selProfId) {
                p = allProfessors.find(x => String(x.id) === String(selProfId));
            } else if (selDept) {
                const filtered = allProfessors.filter(x => x.department && x.department.trim().toLowerCase() === selDept);
                if (filtered.length > 0) p = filtered[0];
            }

            if (!p) {
                alert('Nuk u gjet asnjë pedagog për zgjedhjen tuaj.');
                return;
            }

            selectedProf = p;

            // Fill Card: vetem emer mbiemer
            $('#cardProfName').text(`${p.emri || ''} ${p.mbiemri || ''}`.trim());

            $('#resultSection').fadeIn(200);
        }

        function matchesSemester(courseSem, selectedSem) {
            if (!selectedSem) return true;
            const cSem = String(courseSem || '1').trim().toUpperCase();
            const sel = String(selectedSem).trim().toUpperCase();
            if (sel === '1' || sel === 'I') {
                return cSem === '1' || cSem === 'I' || cSem === 'SEM 1' || cSem === 'SEMESTRI 1' || cSem === 'SEMESTRI I';
            }
            if (sel === '2' || sel === 'II') {
                return cSem === '2' || cSem === 'II' || cSem === 'SEM 2' || cSem === 'SEMESTRI 2' || cSem === 'SEMESTRI II';
            }
            return cSem === sel;
        }

        async function shkarkoCurrentProf() {
            await shkarkoOriginalPDF();
        }

        async function shkarkoOriginalPDF() {
            if (!selectedProf) return;

            const profFullName = `${selectedProf.emri} ${selectedProf.mbiemri}`;
            let deptName = (selectedProf.department || 'Inxhinierisë Informatike').trim();
            let cleanDept = deptName.replace(/^departamenti\s+i\s+/i, '');

            const selSemester = $('#filterSemestri').val() || '1';
            const romanSemester = (selSemester === '2' || selSemester === 'II') ? 'II' : 'I';

            const profEv = allEvidenca.filter(e => e.professorId === selectedProf.id && matchesSemester(e.semester, selSemester));

            // Group by course
            const byCourse = {};
            profEv.forEach(e => {
                if (!byCourse[e.courseId]) {
                    byCourse[e.courseId] = { ...e };
                } else {
                    if (e.oreLeksion) {
                        byCourse[e.courseId].oreLeksion = (byCourse[e.courseId].oreLeksion || 0) + e.oreLeksion;
                        byCourse[e.courseId].grupiLeksion = mergeGroups(byCourse[e.courseId].grupiLeksion, e.grupiLeksion);
                    }
                    if (e.oreSeminar) {
                        byCourse[e.courseId].oreSeminar = (byCourse[e.courseId].oreSeminar || 0) + e.oreSeminar;
                        byCourse[e.courseId].grupiSeminar = mergeGroups(byCourse[e.courseId].grupiSeminar, e.grupiSeminar);
                    }
                    if (e.oreLaborator) {
                        byCourse[e.courseId].oreLaborator = (byCourse[e.courseId].oreLaborator || 0) + e.oreLaborator;
                        byCourse[e.courseId].grupiLaborator = mergeGroups(byCourse[e.courseId].grupiLaborator, e.grupiLaborator);
                    }
                    if (e.oreDetyreKursi) {
                        byCourse[e.courseId].oreDetyreKursi = (byCourse[e.courseId].oreDetyreKursi || 0) + e.oreDetyreKursi;
                        byCourse[e.courseId].grupiDetyreKursi = mergeGroups(byCourse[e.courseId].grupiDetyreKursi, e.grupiDetyreKursi);
                    }
                    if (e.orePraktike) {
                        byCourse[e.courseId].orePraktike = (byCourse[e.courseId].orePraktike || 0) + e.orePraktike;
                        byCourse[e.courseId].grupiPraktike = mergeGroups(byCourse[e.courseId].grupiPraktike, e.grupiPraktike);
                    }
                }
            });

            let courses = Object.values(byCourse);
            if (courses.length === 0) {
                courses = [{
                    courseId: 0,
                    courseEmri: `Pa lëndë të alokuara për Semestrin ${romanSemester}`,
                    programEmri: '—',
                    kredite: 0,
                    oreLeksion: 0,
                    oreSeminar: 0,
                    oreLaborator: 0,
                    oreDetyreKursi: 0,
                    orePraktike: 0
                }];
            }

            // Convert /favicon.svg and /images/ftiidoclogo.png into PNG data URIs for Word
            const uptLogoPngData = await svgToPngBase64('/favicon.svg', 70, 70);
            const ftiLogoPngData = await svgToPngBase64('/images/ftiidoclogo.png', 140, 55);
            const wordContent = buildWordDoc(profFullName, deptName, courses, ftiLogoPngData, uptLogoPngData, romanSemester);

            // Download directly as Microsoft Word .doc file with UTF-8 BOM
            const blob = new Blob(['\ufeff' + wordContent], {
                type: 'application/msword;charset=utf-8'
            });

            const safeProfName = profFullName.replace(/[^a-zA-Z0-9_\-]/g, '_');
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `Evidenca_${safeProfName}_Semestri_${romanSemester}.doc`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        }

        function svgToPngBase64(svgUrl, width, height) {
            return new Promise((resolve) => {
                try {
                    const img = new Image();
                    img.crossOrigin = 'Anonymous';
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = width || img.naturalWidth || 60;
                        canvas.height = height || img.naturalHeight || 60;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/png'));
                    };
                    img.onerror = () => resolve(null);
                    img.src = svgUrl;
                } catch (e) {
                    resolve(null);
                }
            });
        }

        function getGroupCount(raw) {
            if (!raw) return 1;
            let s = String(raw).trim();
            if (!s) return 1;
            if (/^t[eë]\s+gjith[eë]/i.test(s) || /all/i.test(s)) return 1;
            let parts = s.split(',').map(p => formatSingleGroup(p)).filter(Boolean);
            let unique = [...new Set(parts)];
            return unique.length > 0 ? unique.length : 1;
        }

        /* ---------- BUILD OFFICIAL MICROSOFT WORD DOCUMENT (HORIZONTAL / LANDSCAPE) ---------- */
        function buildWordDoc(profName, deptName, courses, ftiLogoData, uptLogoData, customSemester) {

            const courseSections = courses.map((c, index) => {

                const hasLeksion = (Number(c.oreLeksion) || 0) > 0;
                const hasSeminar = (Number(c.oreSeminar) || 0) > 0;

                const hasDk = (Number(c.oreDetyreKursi) || 0) > 0;
                const hasPr = (Number(c.orePraktike) || 0) > 0;

                const fmtNum = (n) => {
                    if (n === null || n === undefined || isNaN(n)) return '0';
                    const num = Number(n);
                    return num % 1 === 0 ? String(num) : num.toFixed(1).replace(/\.0$/, '');
                };

                const totalKredite = c.kredite || 6;
                const kLekNum = Number(c.krediteLeksion != null ? c.krediteLeksion : (hasLeksion ? (totalKredite >= 6 ? 3 : 2) : 3)) || 0;
                const kSemNum = Number(c.krediteSeminar != null ? c.krediteSeminar : (hasSeminar ? 1.5 : 1.5)) || 0;
                const kLabNum = Number(c.krediteLaborator != null ? c.krediteLaborator : (hasLab ? 1 : 1)) || 0;
                const kDkNum = Number(c.krediteDetyreKursi != null ? c.krediteDetyreKursi : (hasDk ? 0.5 : 0.5)) || 0;
                const kPrNum = Number(c.kreditePraktike != null ? c.kreditePraktike : (hasPr ? 1 : 1)) || 0;

                const coveredLabCredits = hasLab ? (kLabNum * numLabGroups) : 0;

                const coveredPrCredits = hasPr ? (kPrNum * numPrGroups) : 0;

                const totalCoveredKredite = coveredLekCredits + coveredSemCredits + coveredLabCredits + coveredDkCredits + coveredPrCredits;

                const kreditetLendesText = `${fmtNum(kLekNum)} Leksion + ${fmtNum(kSemNum)} Seminar + ${fmtNum(kLabNum)} Laborator + ${fmtNum(kDkNum)} DK/Projekt = ${totalKredite} kredite`;

                let primaryGroup = 'A';
                if (hasLeksion) {
                    primaryGroup = 'Të gjitha klasat';
                } else if (hasSeminar && hasLab) {
                    primaryGroup = formatGroupName(c.grupiSeminar + ', ' + c.grupiLaborator);
                } else if (hasSeminar) {
                    primaryGroup = cleanSeminar;
                } else if (hasLab) {
                    primaryGroup = cleanLab;
                } else if (hasDk) {
                    primaryGroup = cleanDk;
                } else if (hasPr) {
                    primaryGroup = cleanPr;
                }

                const pageBreakHtml = index > 0 ? `<br clear="all" style="page-break-before:always; mso-special-character:line-break;">` : '';

                return `
        ${pageBreakHtml}

                                    <div style="border: 1.5pt solid black; padding: 2pt 3pt; width: 36pt;">
                                        <div style="font-size: 5pt; letter-spacing: 1pt; font-family: monospace;">п п п п</div>
                                        <div style="font-size: 5.5pt; font-weight: bold; letter-spacing: 0.5pt;">1951 &nbsp; 1991</div>

                                    <div style="font-size: 8.5pt;">Departamenti i ${cleanDept}</div>
                                </td>

                    <td style="width: 16%; text-align: center; vertical-align: middle; border: none; padding: 0;">
                        ${ftiLogoData ? `<img src="${ftiLogoData}" alt="FTI" width="115" height="44" style="width: 115px; height: 44px; max-height: 46px; display: inline-block;">` : `
                        <div style="font-family: 'Arial Black', Impact, Arial, sans-serif; font-size: 26pt; font-weight: 900; color: #991b1b; letter-spacing: -1pt; line-height: 1;">FTI</div>`}
                    </td>
                    <td style="width: 40%; vertical-align: top; border: none; padding: 0;">

                                    <div style="margin-top: 1.5pt; font-size: 8pt;">Grada/Titulli Emri mbiemri i pedagogut: <strong>${profName}</strong></div>
                                    <div style="margin-top: 2pt; font-style: italic; font-size: 8pt; text-align: left;">(firma): </div>
                                </td>

            <!-- COURSE INFO -->

                <div>Kreditet e lëndës: ${kreditetLendesText}</div>

            <!-- TABLE 1: LEKSIONE -->
