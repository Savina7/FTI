    <style>
        .modal-course-item {
            padding: 7px 8px;
            border: none !important;
            border-radius: 4px;
            background: transparent;
            cursor: pointer;
            transition: all 0.12s ease;
            margin-bottom: 2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-course-item:hover {
            background: #fffbeb;
        }

        .modal-course-item.active {
            background-color: #fef3c7 !important;
            border: none !important;
        }

        .modal-course-item.active span {
            color: #92400e !important;
            font-weight: 600 !important;
        }

        .modal-course-item.active .badge {
            background-color: #fde68a !important;
            color: #78350f !important;
            border-color: #fde68a !important;
        }

        /* Butonat dhe Ngjyrat Amber si tek Orari */
        .btn-amber-action {
            background-color: #f59e0b !important;
            border-color: #d97706 !important;
            color: #ffffff !important;
            font-weight: 600;
            transition: all 0.15s ease;
        }

        .btn-amber-action:hover {
            background-color: #d97706 !important;
            border-color: #b45309 !important;
            color: #ffffff !important;
        }

        .btn-amber-soft {
            background-color: #fffbeb !important;
            border: 1px solid #fde68a !important;
            color: #92400e !important;
            transition: all 0.15s ease;
        }

        .btn-amber-soft:hover {
            background-color: #fef3c7 !important;
            color: #78350f !important;
        }

        #modalTeaching .form-select:focus,
        #modalTeaching .form-control:focus {
            border-color: #f59e0b !important;
            box-shadow: 0 0 0 0.15rem rgba(245, 158, 11, 0.2) !important;
        }

        #modalTeaching .form-check-input:checked {
            background-color: #f59e0b !important;
            border-color: #f59e0b !important;
        }

        /* Madhesi me kompakte dhe elegante per fushat e alokimit (Step 2) */
        #modalTcStep2 .form-select,
        #modalTcStep2 .form-select-sm {
            height: 25px !important;
            min-height: 25px !important;
            font-size: 0.72rem !important;
            padding: 1px 18px 1px 6px !important;
            border-radius: 4px !important;
            background-position: right 4px center !important;
            background-size: 10px 8px !important;
        }

        #modalTcStep2 .form-control,
        #modalTcStep2 .form-control-sm {
            height: 25px !important;
            min-height: 25px !important;
            font-size: 0.72rem !important;
            padding: 1px 6px !important;
            border-radius: 4px !important;
        }

        #modalTcStep2 .form-label {
            font-size: 0.69rem !important;
            font-weight: 600 !important;
            margin-bottom: 2px !important;
        }

        #modalTcStep2 .btn-amber-soft {
            font-size: 0.67rem !important;
            padding: 1px 7px !important;
            border-radius: 3px !important;
        }

        #modalTcStep2 .seminar-row,
        #modalTcStep2 .lab-row {
            margin-bottom: 3px !important;
        }

        #modalTcStep2 .form-check.form-switch {
            min-height: auto;
            margin-bottom: 2px !important;
        }

        #modalTcStep2 .form-check-input {
            height: 14px !important;
            width: 26px !important;
            margin-top: 2px !important;
        }
    </style>
</head>

            <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

            <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
            <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>

            <script>
                const _jwt = localStorage.getItem('jwtToken'); const _h = _jwt ? { 'Authorization': 'Bearer ' + _jwt } : {};
                let modalTeaching;
                let tableTeaching = null;
                let allProfessors = [];
                let allCourses = [];
                let dbDepartments = [];
                let dbPrograms = [];
                let allAllocationsData = [];
                let currentClasses = [];
                let currentEditingCourseId = null;

                $(document).ready(function () {
                    $.fn.dataTable.ext.pager.single_number = function (page, pages) {
                        return ['previous', page, 'next'];
                    };

                    modalTeaching = new bootstrap.Modal(document.getElementById('modalTeaching'));
                    setupTableDataFilter();
                    loadDatabaseData();

                    $('#btnFiltroTable').on('click', function () {
                        if (tableTeaching) tableTeaching.draw();
                    });

                    $('#btnRefreshTable').on('click', function () {
                        $('#tableFilterProg').val('');
                        $('#tableFilterViti').val('');
                        if (tableTeaching) tableTeaching.draw();
                    });

                    // Step 1: Departamenti Change
                    $('#selectDepartamenti').on('change', function () {
                        populateNiveliDropdown();
                        populateProgramDropdown();
                        populateVitiDropdown();
                        updateLendetOptions();
                    });

                    // Step 2: Niveli Change
                    $('#selectNiveli').on('change', function () {
                        populateProgramDropdown();
                        populateVitiDropdown();
                        updateLendetOptions();
                    });

                    // Step 3: Programi Change
                    $('#selectProgrami').on('change', function () {
                        populateVitiDropdown();
                        updateLendetOptions();
                    });

                    // Step 4: Viti Change
                    $('#selectViti').on('change', function () {
                        updateLendetOptions();
                    });

                    // Step 5: Lenda Change -> Ngarkon alokimin ekzistues nese ekziston
                    $('#selectLenda').on('change', async function () {
                        const courseId = $(this).val();
                        if (courseId) {
                            await checkExistingCourseAllocation(courseId);
                        } else {
                            $('#modalTcAlert').addClass('d-none').empty();
                        }
                    });

                    $('#formTeaching').on('submit', async function (e) {
                        e.preventDefault();
                        await saveAllocationData();
                    });
                });

                async function loadDatabaseData() {
                    try {
                        // 1. Load Departments from DB API
                        const resDept = await fetch('/api/admin/courses/departments', { headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('jwtToken') || '') } });
                        if (resDept.ok) {
                            dbDepartments = await resDept.json();
                        }

                        // 2. Load Programs from DB API
                        const resProg = await fetch('/api/admin/courses/programs', { headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('jwtToken') || '') } });
                        if (resProg.ok) {
                            dbPrograms = await resProg.json();
                        }

                        // 3. Load Professors from DB API
                        const resProf = await fetch('/api/admin/professors', { headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('jwtToken') || '') } });
                        if (resProf.ok) {
                            allProfessors = await resProf.json();
                            populateProfessorOptions();
                        }

                        // 4. Load Courses from DB API
                        const resCourses = await fetch('/api/admin/courses', { headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('jwtToken') || '') } });
                        if (resCourses.ok) {
                            allCourses = await resCourses.json();
                        }

                        populateDepartmentDropdown();
                        populateNiveliDropdown();
                        populateProgramDropdown();
                        populateVitiDropdown();
                        updateLendetOptions();
                        populateTopFilterDropdowns();

                        // 5. Load Allocations Table
                        loadAllocationsTable();
                    } catch (err) {
                        console.error("Gabim gjate ngarkimit te te dhenave nga databaza:", err);
                    }
                }

                function setupTableDataFilter() {
                    $.fn.dataTable.ext.search.push(function (settings, data, dataIndex) {
                        if (!settings || settings.nTable.id !== 'tabelaTeaching') return true;

                        const selProgId = $('#tableFilterProg').val();
                        const selViti = $('#tableFilterViti').val();

                        if (!selProgId && !selViti) return true;

                        if (!allAllocationsData || !allAllocationsData[dataIndex]) return true;
                        const item = allAllocationsData[dataIndex];

                        if (selProgId && String(item.programId) !== String(selProgId)) return false;
                        if (selViti && String(item.studyYear) !== String(selViti)) return false;

                        return true;
                    });
                }

                function populateTopFilterDropdowns() {
                    const progSelect = $('#tableFilterProg');
                    progSelect.empty().append('<option value="">Te gjitha deget</option>');
                    if (dbPrograms && dbPrograms.length > 0) {
                        dbPrograms.forEach(p => {
                            const nivelInfo = p.nivel ? ` (${p.nivel})` : '';
                            progSelect.append(`<option value="${p.programId}">${p.emri}${nivelInfo}</option>`);
                        });
                    }

                    const vitiSelect = $('#tableFilterViti');
                    vitiSelect.empty().append('<option value="">Gjithe vitet</option>');
                    if (allCourses && allCourses.length > 0) {
                        const uniqueYears = [...new Set(allCourses.map(c => c.studyYear).filter(Boolean))].sort((a, b) => a - b);
                        uniqueYears.forEach(y => {
                            vitiSelect.append(`<option value="${y}">Viti ${y}</option>`);
                        });
                    }
                }

                function populateDepartmentDropdown() {
                    const deptSelect = $('#selectDepartamenti');
                    deptSelect.empty().append('<option value=""></option>');

                    if (dbDepartments && dbDepartments.length > 0) {
                        dbDepartments.forEach(d => {
                            deptSelect.append(`<option value="${d.departmentId}">${d.emerDepartamenti}</option>`);
                        });
                    }
                }

                function populateNiveliDropdown() {
                    const selectedDeptId = $('#selectDepartamenti').val();
                    const niveliSelect = $('#selectNiveli');
                    const currentVal = niveliSelect.val();
                    niveliSelect.empty().append('<option value=""></option>');

                    let sourcePrograms = dbPrograms;
                    if (selectedDeptId) {
                        sourcePrograms = dbPrograms.filter(p => String(p.departmentId) === String(selectedDeptId));
                    }

                    const uniqueNivele = [...new Set(sourcePrograms.map(p => p.nivel).filter(Boolean))];
                    uniqueNivele.forEach(n => {
                        niveliSelect.append(`<option value="${n}">${n}</option>`);
                    });

                    if (currentVal && uniqueNivele.includes(currentVal)) {
                        niveliSelect.val(currentVal);
                    }
                }

                function populateProgramDropdown() {
                    const selectedDeptId = $('#selectDepartamenti').val();

                async function loadClassesForCurrentSelection(progId, viti) {
                    try {
                        const res = await fetch(`/api/admin/schedules/classes?programId=${progId}&studyYear=${viti}`, {
                            headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('jwtToken') || '') }
                        });
                        if (res.ok) {
                            currentClasses = await res.json();
                        } else {
                            currentClasses = [];
                        }
                    } catch (e) {
                        console.error("Gabim gjate ngarkimit te klasave:", e);
                        currentClasses = [];
                    }
                }

                function buildClassOptionsHtml(selectedGroup = "", selectedClassIds = [], isLab = false) {
                    let opts = '';
                    let matched = false;

                    // 1. Klasat reale nga databaza (Grupi A, Grupi B, Grupi C, Grupi D)
                    if (currentClasses && currentClasses.length > 0) {
                        const seenNames = new Set();
                        currentClasses.forEach(cl => {
                            const clName = cl.name || `Klasa ${cl.classId}`;
                            if (seenNames.has(clName)) return;
                            seenNames.add(clName);

                            const isSelById = selectedClassIds && selectedClassIds.some(id => String(id) === String(cl.classId));

                            let isSelByName = false;
                            if (selectedGroup) {
                                const normSel = selectedGroup.trim().toLowerCase();
                                const normCl = clName.trim().toLowerCase();
                                if (normSel === normCl) {
                                    isSelByName = true;
                                } else {
                                    ['a', 'b', 'c', 'd', 'e', 'f'].forEach(letter => {
                                        if (normSel.endsWith(letter) && normCl.endsWith(letter)) {
                                            isSelByName = true;
                                        }
                                    });
                                }
                            }

                            const selected = (isSelById || (!matched && isSelByName)) ? 'selected' : '';
                            if (selected) matched = true;

                            opts += `<option value="${clName}" data-class-id="${cl.classId}" ${selected}>${clName}</option>`;
                        });
                    }

                    // 2. Opsioni per te gjitha klasat (vetem nese ka klasa)
                    if (currentClasses && currentClasses.length > 0) {
                        const allSelected = (!matched && selectedGroup && (selectedGroup.includes('gjitha') || selectedGroup.includes('&'))) ? 'selected' : '';
                        opts += `<option value="Te gjitha klasat" data-class-id="" ${allSelected}>Te gjitha klasat</option>`;
                    } else {
                        // Nese nuk ka asnje klase ne DB per kete program, lihet bosh
                        opts = '<option value=""></option>';
                    }

                    return opts;
                }

                        });

                        container.append(item);
                    });

                    const targetId = selectCourseId || courses[0].courseId;
                    selectSidebarCourse(targetId);

                async function checkExistingCourseAllocation(courseId) {
                    $('#modalTcAlert').addClass('d-none').empty();
                    try {
                        const res = await fetch(`/api/admin/teaching-courses/${courseId}`, { headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('jwtToken') || '') } });
                        if (!res.ok) return;
                        const data = await res.json();

                        if (data && (data.lectureProfessor || (data.seminarProfessors && data.seminarProfessors.length > 0) || (data.labProfessors && data.labProfessors.length > 0))) {
                            if (data.semester) {
                                $('#step2Semestri').val(data.semester);
                            }
                            if (data.durationWeeks) $('#inputKohezgjatja').val(data.durationWeeks);
                            if (data.totalHours) $('#inputOreGjithsej').val(data.totalHours);

                            if (data.lectureHours) $('#inputOreLeksion').val(data.lectureHours);
                            else if (data.totalHours) $('#inputOreLeksion').val(data.totalHours);

                            if (data.seminarHours) $('#inputOreSeminar').val(data.seminarHours);
                            else if (data.totalHours) $('#inputOreSeminar').val(data.totalHours);

                            if (data.labHours) $('#inputOreLab').val(data.labHours);
                            else if (data.totalHours) $('#inputOreLab').val(data.totalHours);

                            if (data.lectureProfessor) {
                                $('#selectLeksionProf').val(data.lectureProfessor.professorId);
                            }

                            $('#seminarContainer').empty();
                            if (data.seminarProfessors && data.seminarProfessors.length > 0) {
                                data.seminarProfessors.forEach(s => {
                                    addSeminarRow(s.professorId, s.classGroup, s.classIds);
                                });
                            } else {
                                addSeminarRow();
                            }

                            $('#labContainer').empty();
                            if (data.labProfessors && data.labProfessors.length > 0) {
                                $('#hasLabSwitch').prop('checked', true);
                                toggleLabSection();
                                data.labProfessors.forEach(l => {
                                    addLabRow(l.professorId, l.classGroup, l.classIds);
                                });
                            } else {
                                $('#hasLabSwitch').prop('checked', false);
                                toggleLabSection();
                            }
                        }
                    } catch (err) {
                        console.log("Nuk u gjet alokim ekzistues per kete lende:", err);
                    }
                }

                async function saveAllocationData() {
                    const courseIdVal = $('#selectLenda').val();
                    const courseId = courseIdVal ? parseInt(courseIdVal) : null;
                    if (!courseId) {
                        alert("Ju lutem zgjidhni një lëndë nga lista në të majtë.");
                        return;
                    }

                    const lectureProfId = $('#selectLeksionProf').val() ? parseInt($('#selectLeksionProf').val()) : null;

                    const seminars = [];
                    $('#seminarContainer .seminar-row').each(function () {
                        const profId = $(this).find('.select-seminar-prof').val();
                        const selEl = $(this).find('.select-seminar-group');
                        const group = selEl.val();
                        const classId = selEl.find('option:selected').data('class-id');
                        const classIds = classId ? [parseInt(classId)] : [];
                        if (profId) {
                            seminars.push({
                                professorId: parseInt(profId),
                                classGroup: group,
                                classIds: classIds
                            });
                        }
                    });

                    const hasLab = $('#hasLabSwitch').is(':checked');
                    const labs = [];
                    if (hasLab) {
                        $('#labContainer .lab-row').each(function () {
                            const profId = $(this).find('.select-lab-prof').val();
                            const selEl = $(this).find('.select-lab-group');
                            const group = selEl.val();
                            const classId = selEl.find('option:selected').data('class-id');
                            const classIds = classId ? [parseInt(classId)] : [];
                            if (profId) {
                                labs.push({
                                    professorId: parseInt(profId),
                                    classGroup: group,
                                    classIds: classIds
                                });
                            }
                        });
                    }

                    const semesterVal = $('#step2Semestri').val() || '1';
                    const lectureHoursVal = $('#inputOreLeksion').val() !== '' ? parseInt($('#inputOreLeksion').val()) : 30;
                    const seminarHoursVal = $('#inputOreSeminar').val() !== '' ? parseInt($('#inputOreSeminar').val()) : 30;
                    const labHoursVal = $('#inputOreLab').val() !== '' ? parseInt($('#inputOreLab').val()) : 15;

                    const payload = {
                        courseId: courseId,
                        semester: semesterVal,
                        durationWeeks: $('#inputKohezgjatja').val() !== '' ? parseInt($('#inputKohezgjatja').val()) : null,
                        totalHours: lectureHoursVal,
                        lectureHours: lectureHoursVal,
                        seminarHours: seminarHoursVal,
                        labHours: labHoursVal,
                        lectureProfessorId: lectureProfId,
                        seminars: seminars,
                        hasLab: hasLab,
                        labs: labs
                    };

                    try {
                        const response = await fetch('/api/admin/teaching-courses', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        if (response.ok) {
                            await loadAllocationsTable();
                            const progId = $('#selectProgrami').val();
                            const viti = $('#selectViti').val();
                            let courses = allCourses.filter(c => String(c.programId) === String(progId) && String(c.studyYear) === String(viti));
                            renderModalCoursesSidebar(courses, courseId);

                            $('#modalTcAlert').addClass('d-none').empty();
                        } else {
                            let msg = "Gabim gjate ruajtjes se te dhenave te alokimit.";
                            try {
                                const errObj = await response.json();
                                if (errObj.message) msg = errObj.message;
                            } catch (_) { }
                            $('#modalTcAlert').removeClass('d-none alert-info alert-success').addClass('alert-danger').text(msg);
                        }
                    } catch (err) {
                        console.error("Gabim ruajtjeje:", err);
                        alert("Gabim lidhjeje me serverin: " + err.message);
                    }
                }

                async function deleteAllocation(courseId) {
                    if (!confirm("A jeni i sigurt qe deshironi ta fshini kete mesimdhenie?")) return;
                    try {
                        const res = await fetch(`/api/admin/teaching-courses/${courseId}`, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('jwtToken') || '') } });
                        if (res.ok) {
                            loadAllocationsTable();
                        } else {
                            let msg = "Gabim gjate fshirjes se mesimdhenies.";
                            try {
                                const errObj = await res.json();
                                if (errObj && errObj.message) msg = errObj.message;
                            } catch (_) { }
                            alert(msg);
                        }
                    } catch (err) {
                        console.error("Gabim fshirjeje:", err);
                        alert("Gabim gjate komunikimit me serverin: " + err.message);
                    }
                }
            </script>

        </div>
    </div>

    </div>

</body>
