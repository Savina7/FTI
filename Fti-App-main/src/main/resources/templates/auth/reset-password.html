<!DOCTYPE html>
<html lang="sq" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTI</title>

<link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style1.css">
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 p-2">

    <div class="card verify-card p-3">

<div id="errorBanner" class="alert alert-danger py-1 px-2 text-center extra-small mb-2 d-none" role="alert">
            <i class="bi bi-exclamation-circle me-1"></i>
            <span id="errorText"></span>
        </div>

<div id="successBanner" class="alert alert-success py-1 px-2 text-center extra-small mb-2 d-none" role="alert">
            <i class="bi bi-check-circle me-1"></i>
            <span id="successText"></span>
        </div>

<form id="newPasswordForm" onsubmit="handleNewPasswordSubmit(event)">

<div class="field-group mb-2">
                <label for="newPassword" class="form-label fw-semibold">Fjalekalimi i ri</label>
                <div class="input-group input-group-sm">
                    <input type="password" id="newPassword" class="form-control form-control-sm" required
                        oninput="validatePasswordRules()" autofocus>
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('newPassword', 'eye1')">
                        <i class="bi bi-eye" id="eye1"></i>
                    </button>
                </div>
            </div>

<div class="password-rules mb-2">
                <div class="rule" id="rule-length"><i class="bi bi-circle"></i> Te pakten 8 karaktere</div>
                <div class="rule" id="rule-upper"><i class="bi bi-circle"></i> Nje shkronje te madhe (A-Z)</div>
                <div class="rule" id="rule-lower"><i class="bi bi-circle"></i> Nje shkronje te vogel (a-z)</div>
                <div class="rule" id="rule-digit"><i class="bi bi-circle"></i> Nje numer (0-9)</div>
                <div class="rule" id="rule-special"><i class="bi bi-circle"></i> Nje karakter special (!@#$%^&*)</div>
            </div>

<div class="field-group mb-3">
                <label for="confirmPassword" class="form-label fw-semibold">Konfirmo fjalekalimin</label>
                <div class="input-group input-group-sm">
                    <input type="password" id="confirmPassword" class="form-control form-control-sm" required
                        oninput="validatePasswordRules()">
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('confirmPassword', 'eye2')">
                        <i class="bi bi-eye" id="eye2"></i>
                    </button>
                </div>
                <div id="mismatchError" class="text-danger extra-small d-none mt-1">
                    <i class="bi bi-x-circle me-1"></i> Fjalekalimet nuk perputhen.
                </div>
            </div>

<button type="submit" id="btnSubmitNewPassword" class="btn btn-primary btn-sm w-100 py-1 fw-semibold extra-small">
                <span class="spinner-border spinner-border-sm d-none me-1" id="saveSpinner"></span>
                Ruaj fjalekalimin e ri
            </button>
        </form>

</div>

<script>
        const email = sessionStorage.getItem('resetEmail');
        const code = sessionStorage.getItem('resetCode');

        // Kontrollojme nese ka ardhur nga verifikimi
        if (!email || !code) {
            window.location.href = '/forgot-password';
        } else {
            const label = document.getElementById('targetEmailLabel');
            if (label) label.textContent = email;
        }

        function showError(msg) {
            const b = document.getElementById('errorBanner');
            document.getElementById('errorText').textContent = msg || '';
            b.classList.toggle('d-none', !msg);
            if (msg) document.getElementById('successBanner').classList.add('d-none');
        }

        function showSuccess(msg) {
            const b = document.getElementById('successBanner');
            document.getElementById('successText').textContent = msg || '';
            b.classList.toggle('d-none', !msg);
            if (msg) document.getElementById('errorBanner').classList.add('d-none');
        }

        function togglePassword(inputId, iconId) {
            const inp = document.getElementById(inputId);
            const ico = document.getElementById(iconId);
            if (inp.type === 'password') {
                inp.type = 'text';
                ico.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                inp.type = 'password';
                ico.classList.replace('bi-eye-slash', 'bi-eye');
            }
        }

        function updateRule(elementId, isValid) {
            const el = document.getElementById(elementId);
            if (!el) return;
            const icon = el.querySelector('i');
            if (isValid) {
                el.className = 'rule valid';
                if (icon) icon.className = 'bi bi-check-circle-fill';
            } else {
                el.className = 'rule';
                if (icon) icon.className = 'bi bi-circle';
            }
        }

        function validatePasswordRules() {
            const p1 = document.getElementById('newPassword').value;
            const p2 = document.getElementById('confirmPassword').value;

            updateRule('rule-length', p1.length >= 8);
            updateRule('rule-upper', /[A-Z]/.test(p1));
            updateRule('rule-lower', /[a-z]/.test(p1));
            updateRule('rule-digit', /\d/.test(p1));
            updateRule('rule-special', /[^a-zA-Z0-9]/.test(p1));

            const mismatch = document.getElementById('mismatchError');
            if (p2.length > 0 && p1 !== p2) {
                mismatch.classList.remove('d-none');
            } else {
                mismatch.classList.add('d-none');
            }
        }

        async function handleNewPasswordSubmit(e) {
            e.preventDefault();
            showError(null);
            showSuccess(null);

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^a-zA-Z0-9]).{8,}$/;
            if (!passwordRegex.test(newPassword)) {
                showError("Fjalekalimi nuk ploteson te gjitha kriteret e sigurise.");
                return;
            }

            if (newPassword !== confirmPassword) {
                showError("Fjalekalimet nuk perputhen.");
                return;
            }

            const btn = document.getElementById('btnSubmitNewPassword');
            const spinner = document.getElementById('saveSpinner');
            btn.disabled = true;
            spinner.classList.remove('d-none');

            try {
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: email,
                        code: code,
                        newPassword: newPassword
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Pastrojme te dhenat e sesionit per siguri
                    sessionStorage.removeItem('resetEmail');
                    sessionStorage.removeItem('resetCode');

                    showSuccess("Fjalekalimi u ndryshua me sukses! Po ridrejtoheni te hyrja...");
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1500);
                } else {
                    showError(data.message || "Ndryshimi i fjalekalimit deshtoi. Kodi mund te kete skaduar.");
                    btn.disabled = false;
                    spinner.classList.add('d-none');
                }
            } catch (err) {
                showError("Gabim ne lidhje me serverin.");
                btn.disabled = false;
                spinner.classList.add('d-none');
            }
        }
    </script>
</body>

</html>
