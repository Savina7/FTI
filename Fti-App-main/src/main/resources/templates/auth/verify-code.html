<!DOCTYPE html>
<html lang="sq" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTI</title>

    <!-- Favicon UPT SVG -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style1.css">
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 p-2">

    <div class="card verify-card p-3">

        <!-- LOGO -->
        <div class="text-center mb-2">
            <img src="/images/ftilogo.png" alt="Logo e Fakultetit" class="school-logo">
        </div>

        <h6 class="fw-bold text-center mb-1">Verifikimi i Email-it</h6>
        <p class="text-muted text-center extra-small mb-3">
            Kemi derguar nje kod 6-shifror ne adresen tuaj te email-it.
        </p>

        <!-- ERROR BANNER -->
        <div id="errorBanner" class="alert alert-danger py-1 px-2 text-center extra-small mb-2 d-none" role="alert">
            <i class="bi bi-exclamation-circle me-1"></i>
            <span id="errorText"></span>
        </div>

        <!-- SUCCESS BANNER -->
        <div id="successBanner" class="alert alert-success py-1 px-2 text-center extra-small mb-2 d-none" role="alert">
            <i class="bi bi-check-circle me-1"></i>
            <span id="successText"></span>
        </div>

        <!-- FORM -->
        <form id="verifyForm" onsubmit="handleVerifySubmit(event)">

            <input type="hidden" id="userIdInput" th:value="${userId}">

            <!-- 6 OTP INPUT BOXES -->
            <div class="d-flex justify-content-between gap-1 mb-3" id="otpContainer">
                <input type="text" class="form-control form-control-sm otp-input text-center fw-bold" maxlength="1"
                    pattern="[0-9]" inputmode="numeric" required autofocus>
                <input type="text" class="form-control form-control-sm otp-input text-center fw-bold" maxlength="1"
                    pattern="[0-9]" inputmode="numeric" required>
                <input type="text" class="form-control form-control-sm otp-input text-center fw-bold" maxlength="1"
                    pattern="[0-9]" inputmode="numeric" required>
                <input type="text" class="form-control form-control-sm otp-input text-center fw-bold" maxlength="1"
                    pattern="[0-9]" inputmode="numeric" required>
                <input type="text" class="form-control form-control-sm otp-input text-center fw-bold" maxlength="1"
                    pattern="[0-9]" inputmode="numeric" required>
                <input type="text" class="form-control form-control-sm otp-input text-center fw-bold" maxlength="1"
                    pattern="[0-9]" inputmode="numeric" required>
            </div>

            <!-- SUBMIT BUTTON -->
            <button type="submit" class="btn btn-primary btn-sm w-100 py-1 fw-semibold extra-small">
                <span class="spinner-border spinner-border-sm d-none me-1" id="verifySpinner"></span>
                Verifiko Kodin
            </button>
        </form>

        <!-- RESEND WITH TIMER -->
        <div class="text-center mt-3 pt-2 border-top extra-small">
            <span class="text-muted">Nuk e moret kodin? </span>
            <button id="resendBtn" class="btn btn-link p-0 extra-small text-decoration-none fw-bold text-primary"
                onclick="resendCode()" disabled>
                Rindergo (<span id="timer">60</span>s)
            </button>
        </div>

    </div>

    <script>
        const inputs = document.querySelectorAll('.otp-input');
        const resendBtn = document.getElementById('resendBtn');
        let timeLeft = 60;
        let timerInterval;

        // Auto-move cursor between boxes
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const paste = e.clipboardData.getData('text').trim();
                if (/^\d{6}$/.test(paste)) {
                    paste.split('').forEach((ch, i) => { if (inputs[i]) inputs[i].value = ch; });
                    inputs[inputs.length - 1].focus();
                }
            });
        });

        function showError(msg) {
            const b = document.getElementById('errorBanner');
            document.getElementById('errorText').textContent = msg || '';
            b.classList.toggle('d-none', !msg);
        }

        function showSuccess(msg) {
            const b = document.getElementById('successBanner');
            document.getElementById('successText').textContent = msg || '';
            b.classList.toggle('d-none', !msg);
        }

        async function handleVerifySubmit(e) {
            e.preventDefault();
            showError(null);

            let code = '';
            inputs.forEach(i => code += i.value);
            if (code.length !== 6) {
                showError("Shkruani te 6 shifrat e kodit.");
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const userId = parseInt(urlParams.get('userId') || document.getElementById('userIdInput').value);

            if (!userId) {
                showError("userId mungon.");
                return;
            }

            const spinner = document.getElementById('verifySpinner');
            spinner.classList.remove('d-none');

            try {
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId, code: code })
                });

                const data = await response.json();
                if (response.ok) {
                    if (data.token) {
                        localStorage.setItem('jwtToken', data.token);
                    }
                    let redirectUrl = '/student';
                    if (data.role === 'PROFESSOR' || data.role === 'TEACHER') {
                        redirectUrl = '/rregjistri';
                    }
                    showSuccess("Verifikimi u krye me sukses! Ridrejtimi...");
                    setTimeout(() => { window.location.href = redirectUrl; }, 1000);
                } else {
                    showError(data.message || "Kodi eshte i pasakte.");
                }
            } catch (err) {
                showError("Gabim lidhje me serverin.");
            } finally {
                spinner.classList.add('d-none');
            }
        }

        function startTimer() {
            timeLeft = 60;
            resendBtn.disabled = true;
            resendBtn.innerHTML = 'Rindergo (<span id="timer">60</span>s)';
            timerInterval = setInterval(() => {
                timeLeft--;
                const t = document.getElementById('timer');
                if (t) t.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    resendBtn.disabled = false;
                    resendBtn.textContent = 'Rindergo Kodin';
                }
            }, 1000);
        }

        async function resendCode() {
            const urlParams = new URLSearchParams(window.location.search);
            const userId = parseInt(urlParams.get('userId') || document.getElementById('userIdInput').value);
            resendBtn.disabled = true;

            try {
                const response = await fetch(`/api/verify/resend?userId=${userId}`, { method: 'POST' });
                const data = await response.json();
                if (response.ok) {
                    startTimer();
                    showSuccess("Kodi i ri u dergua me sukses.");
                    inputs.forEach(i => i.value = '');
                    inputs[0].focus();
                } else {
                    showError(data.message || "Dergimi deshtoi.");
                    resendBtn.disabled = false;
                }
            } catch (err) {
                showError("Gabim lidhje me serverin.");
                resendBtn.disabled = false;
            }
        }

        startTimer();
    </script>

</body>

</html>
