<!DOCTYPE html>
<html lang="sq" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTI</title>

<link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style1.css">
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 p-2">

    <div class="card verify-card p-3">

<h6 class="fw-bold text-center mb-3" id="cardTitle">Harruat fjalekalimin?</h6>

<div id="errorBanner" class="alert alert-danger py-1 px-2 text-center extra-small mb-2 d-none" role="alert">
            <i class="bi bi-exclamation-circle me-1"></i>
            <span id="errorText"></span>
        </div>

<div id="stepRequestCode">
            <p class="text-muted text-center extra-small mb-3">
                Vendosni email-in tuaj institucional per te marre kodin 6-shifror te sigurise.
            </p>

            <form id="requestCodeForm" onsubmit="handleRequestCode(event)">
                <div class="field-group mb-3">
                    <input type="email" id="resetEmail" class="form-control form-control-sm" required
                           placeholder="Emaili institucional" autofocus>
                </div>

                <button type="submit" id="btnRequestCode" class="btn btn-primary btn-sm w-100 py-1 fw-semibold extra-small">
                    <span class="spinner-border spinner-border-sm d-none me-1" id="requestSpinner"></span>
                    Dergo kodin ne email
                </button>
            </form>
        </div>

<div id="stepVerifyCode" class="d-none">
            <form id="verifyCodeForm" onsubmit="handleVerifyCode(event)">

<div class="d-flex justify-content-between gap-1 mb-3" id="otpContainer">
                    <input type="text" class="form-control form-control-sm otp-input text-center fw-bold" maxlength="1"
                        pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="form-control form-control-sm otp-input text-center fw-bold" maxlength="1"
                        pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="form-control form-control-sm otp-input text-center fw-bold" maxlength="1"
                        pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="form-control form-control-sm otp-input text-center fw-bold" maxlength="1"
                        pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="form-control form-control-sm otp-input text-center fw-bold" maxlength="1"
                        pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="form-control form-control-sm otp-input text-center fw-bold" maxlength="1"
                        pattern="[0-9]" inputmode="numeric" required>
                </div>

<button type="submit" id="btnVerifyCode" class="btn btn-primary btn-sm w-100 py-1 fw-semibold extra-small">
                    <span class="spinner-border spinner-border-sm d-none me-1" id="verifySpinner"></span>
                    Verifiko kodin
                </button>
            </form>

<div class="text-center mt-3 pt-2 border-top extra-small">
                <span class="text-muted">Nuk e moret kodin? </span>
                <button id="resendBtn" class="btn btn-link p-0 extra-small text-decoration-none fw-bold text-primary"
                    onclick="resendCode()" disabled>
                    Rindergo (<span id="timer">60</span>s)
                </button>
            </div>
        </div>

</div>

<script>
        let currentEmail = '';
        let timeLeft = 60;
        let timerInterval;

        const otpInputs = document.querySelectorAll('.otp-input');
        const resendBtn = document.getElementById('resendBtn');

        // Auto-move cursor between OTP inputs
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const paste = e.clipboardData.getData('text').trim();
                if (/^\d{6}$/.test(paste)) {
                    paste.split('').forEach((ch, i) => { if (otpInputs[i]) otpInputs[i].value = ch; });
                    otpInputs[otpInputs.length - 1].focus();
                }
            });
        });

        function showError(msg) {
            const b = document.getElementById('errorBanner');
            document.getElementById('errorText').textContent = msg || '';
            b.classList.toggle('d-none', !msg);
        }

        function switchBackToStep1(e) {
            if (e) e.preventDefault();
            clearInterval(timerInterval);
            document.getElementById('stepVerifyCode').classList.add('d-none');
            document.getElementById('stepRequestCode').classList.remove('d-none');
            document.getElementById('cardTitle').textContent = "Harruat fjalekalimin?";
            showError(null);
        }

        // STEP 1: Kerko kodin
        async function handleRequestCode(e) {
            e.preventDefault();
            showError(null);

            const emailInput = document.getElementById('resetEmail');
            const email = emailInput.value.trim();
            if (!email) {
                showError("Ju lutem vendosni email-in.");
                return;
            }

            const btn = document.getElementById('btnRequestCode');
            const spinner = document.getElementById('requestSpinner');
            btn.disabled = true;
            spinner.classList.remove('d-none');

            try {
                const response = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();

                if (response.ok) {
                    currentEmail = email;
                    const displayEl = document.getElementById('displayTargetEmail');
                    if (displayEl) displayEl.textContent = email;

                    // Kalojme te Hapi 2: Verifikimi i kodit
                    document.getElementById('stepRequestCode').classList.add('d-none');
                    document.getElementById('stepVerifyCode').classList.remove('d-none');
                    document.getElementById('cardTitle').textContent = "Verifikimi i kodit";

                    startTimer();
                    setTimeout(() => { otpInputs[0].focus(); }, 150);
                } else {
                    showError(data.message || "Email-i nuk u gjet ne sistem.");
                }
            } catch (err) {
                showError("Gabim ne komunikim me serverin.");
            } finally {
                btn.disabled = false;
                spinner.classList.add('d-none');
            }
        }

        // STEP 2: Verifiko kodin (Vetëm verifikim)
        async function handleVerifyCode(e) {
            e.preventDefault();
            showError(null);

            let code = '';
            otpInputs.forEach(i => code += i.value);
            if (code.length !== 6) {
                showError("Ju lutem plotesoni te 6 shifrat e kodit.");
                return;
            }

            const btn = document.getElementById('btnVerifyCode');
            const spinner = document.getElementById('verifySpinner');
            btn.disabled = true;
            spinner.classList.remove('d-none');

            try {
                const response = await fetch('/api/verify-reset-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: currentEmail,
                        code: code
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    sessionStorage.setItem('resetEmail', currentEmail);
                    sessionStorage.setItem('resetCode', code);
                    clearInterval(timerInterval);
                    window.location.href = '/reset-password';
                } else {
                    showError(data.message || "Kodi eshte i pasakte ose ka skaduar.");
                }
            } catch (err) {
                showError("Gabim ne komunikim me serverin.");
            } finally {
                btn.disabled = false;
                spinner.classList.add('d-none');
            }
        }

        // Timer per rindergim
        function startTimer() {
            timeLeft = 60;
            resendBtn.disabled = true;
            resendBtn.innerHTML = 'Rindergo (<span id="timer">60</span>s)';
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                const t = document.getElementById('timer');
                if (t) t.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    resendBtn.disabled = false;
                    resendBtn.textContent = 'Rindergo kodin';
                }
            }, 1000);
        }

        // Rindergo kodin
        async function resendCode() {
            if (!currentEmail) return;
            resendBtn.disabled = true;
            showError(null);

            try {
                const response = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail })
                });

                const data = await response.json();
                if (response.ok) {
                    startTimer();
                    otpInputs.forEach(i => i.value = '');
                    otpInputs[0].focus();
                } else {
                    showError(data.message || "Dergimi i kodit deshtoi.");
                    resendBtn.disabled = false;
                }
            } catch (err) {
                showError("Gabim gjate dergimit te kodit.");
                resendBtn.disabled = false;
            }
        }
    </script>
</body>

</html>
