<!DOCTYPE html>
<html lang="sq">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTI</title>

    <!-- Favicon UPT SVG -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS-i yt i perbashket -->
    <link rel="stylesheet" href="/css/style1.css">
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 p-2">

    <!-- Perdorim login-card ketu -->
    <div class="card login-card p-3">

        <!-- VENDI PER LOGO-N E SHKOLLES -->
        <div class="text-center mb-2">
            <img src="/images/ftilogo.png" alt="Logo e Fakultetit" class="school-logo">
        </div>

        <h6 class="fw-bold text-center mb-1">Hyni ne Llogari</h6>
        <p class="text-muted text-center extra-small mb-3">Miresevini perseri ne portal</p>

        <!-- NOTIFICATION BANNER -->
        <div id="loginAlert" class="alert alert-danger py-1 px-2 d-none text-center extra-small mb-3" role="alert">
            <i class="bi bi-exclamation-circle me-1"></i> Kredencialet jane te pasakta!
        </div>

        <!-- FORMULARI I LOGIN-IT -->
        <form id="loginForm" class="needs-validation" novalidate onsubmit="handleLogin(event)">

            <!-- 1. EMAILI INSTITUCIONAL -->
            <div class="field-group">
                <input type="email" id="loginEmail" class="form-control form-control-sm" required
                    placeholder="Emaili Institucional">
                <div class="invalid-feedback extra-small">Ju lutem vendosni nje email te vlefshem.</div>
            </div>

            <!-- 2. FJALEKALIMI -->
            <div class="field-group">
                <input type="password" id="loginPassword" class="form-control form-control-sm" required
                    placeholder="Fjalekalimi">
                <div class="invalid-feedback extra-small">Ju lutem vendosni fjalekalimin.</div>
            </div>

            <!-- OPTIONS: REMEMBER ME & FORGOT PASSWORD -->
            <div class="d-flex justify-content-between align-items-center mb-3 extra-small">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label text-muted" for="rememberMe">Me mbaj mend</label>
                </div>
                <a href="#" class="text-decoration-none text-primary fw-semibold">Harruat fjalekalimin?</a>
            </div>

            <!-- BUTONI I HYRJES -->
            <button type="submit" class="btn btn-primary btn-sm w-100 py-1 fw-semibold extra-small">
                Hyr
            </button>
        </form>

        <!-- FOOTER: LINKU PER REGJISTRIM -->
        <div class="text-center mt-3 pt-2 border-top extra-small">
            <span class="text-muted">Don't have an account? </span>
            <a href="/register" class="fw-bold text-decoration-none text-primary">Register</a>
        </div>

    </div>

    <!-- LOGJIKA JAVASCRIPT -->
    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const emailInput = document.getElementById('loginEmail');
            const passwordInput = document.getElementById('loginPassword');
            const alertDiv = document.getElementById('loginAlert');

            alertDiv.classList.add('d-none');

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                alertDiv.innerHTML = '<i class="bi bi-exclamation-circle me-1"></i> Plotesoni email-in dhe fjalekalimin!';
                alertDiv.classList.remove('d-none');
                return;
            }

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });

                const data = await response.json();

                if (response.ok) {
                    // 1. Ruajme JWT Token dhe te dhenat ne localStorage
                    if (data.token) {
                        localStorage.setItem('jwtToken', data.token);
                    }
                    if (data.role) {
                        localStorage.setItem('userRole', data.role);
                    }
                    if (data.id) {
                        localStorage.setItem('userId', data.id);
                    }
                    if (data.email) {
                        localStorage.setItem('userEmail', data.email);
                    }
                    if (data.name) {
                        localStorage.setItem('userName', data.name);
                    }

                    // 2. Ridrejtimi dinamik sipas rolit apo email-it te perdoruesit
                    let redirectUrl = '/student';
                    if (data.role === 'PROFESSOR' || data.role === 'TEACHER') {
                        redirectUrl = '/rregjistri';
                    } else if (data.role === 'ADMIN' || (data.email && data.email.toLowerCase() === 'admin@fti.edu.al')) {
                        redirectUrl = '/dashboard_reports';
                    }

                    window.location.href = redirectUrl;
                } else {
                    alertDiv.innerHTML = `<i class="bi bi-exclamation-circle me-1"></i> ${data.message || 'Kredencialet jane te pasakta!'}`;
                    alertDiv.classList.remove('d-none');
                }
            } catch (err) {
                alertDiv.innerHTML = '<i class="bi bi-exclamation-circle me-1"></i> Gabim lidhje me serverin.';
                alertDiv.classList.remove('d-none');
            }
        }
    </script>

</body>

</html>
