<!DOCTYPE html>
<html lang="sq">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Studenti - FTI</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <!-- Auth Interceptor -->
    <script src="/js/app.js"></script>
    <script src="/js/auth-interceptor.js"></script>
</head>

<body>

    <div class="d-flex" id="wrapper">

        <!-- ================= SIDEBAR ================= -->
        <aside id="sidebar-wrapper" class="bg-white border-end d-flex flex-column justify-content-between">

            <!-- Pjesa e Siperme: Logo + Navigimi -->
            <div>
                <!-- Header i Sidebar-it me Logo -->
                <div class="sidebar-heading px-3 py-3 border-bottom text-center">
                    <a href="/student" class="d-block text-decoration-none">
                        <img src="/images/ftilogo.png" alt="FTI Logo" class="sidebar-logo">
                    </a>
                </div>

                <!-- Menyte Kryesore -->
                <div class="list-group list-group-flush py-3">
                    <!-- Dashboard / Profili -->
                    <a href="/student" class="list-group-item list-group-item-action border-0 px-4 py-2.5 active">
                        Profili
                    </a>

                    <!-- Notat -->
                    <a href="/nota" class="list-group-item list-group-item-action border-0 px-4 py-2.5">
                        Notat
                    </a>

                    <!-- Mungesat -->
                    <a href="/mungesat" class="list-group-item list-group-item-action border-0 px-4 py-2.5">
                        Mungesat
                    </a>

                    <!-- Orari -->
                    <a href="/course_schedule" class="list-group-item list-group-item-action border-0 px-4 py-2.5">
                        Orari
                    </a>
                </div>
            </div>

            <!-- Pjesa e Poshtme: Logout -->
            <div class="p-3 border-top">
                <a href="/" class="btn-logout d-flex align-items-center gap-2 px-3 py-2 text-decoration-none rounded-2">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Logout</span>
                </a>
            </div>

        </aside>

        <!-- ================= MAIN CONTENT AREA ================= -->
        <div id="page-content-wrapper" class="w-100 bg-light">

            <!-- HEADER TOP BAR -->
            <header
                class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4 py-2 justify-content-between">
                <div class="d-flex align-items-center">
                    <h6 class="mb-0 fw-bold text-secondary"></h6>
                </div>

                <!-- User Info -->
                <div class="d-flex align-items-center gap-3">
                    <div class="text-end d-none d-sm-block">
                        <span class="d-block fw-bold small text-dark" id="headerStudentName">-</span>
                    </div>
                </div>
            </header>

            <!-- PERMBAJTJA E FAQES -->
            <main class="container-fluid p-4">

                <div class="d-flex justify-content-center align-items-start pt-2">

                    <!-- Karta me width: 100% dhe max-width me inline styles per te tejkaluar CSS-ne -->
                    <div class="student-card shadow-sm border-0 bg-white rounded-3 p-4"
                        style="width: 100% !important; max-width: 900px !important;">

                        <!-- Kryet e kartes -->
                        <div class="profile-header pb-3 mb-4 border-bottom">
                            <h4 class="fw-bold mb-1 text-dark-custom">
                                <span class="text-muted fw-normal">Studenti :</span> <span id="cardStudentName">-</span>
                            </h4>
                            <span class="text-muted fs-6">Numri i Matrikullimit : <span
                                    id="cardMatrikulli">-</span></span>
                        </div>

                        <!-- Lista e Informacioneve -->
                        <div class="info-list d-flex flex-column gap-3">

                            <div class="info-item py-2">
                                <span class="info-label fs-6">Programi i Studimit</span>
                                <span class="info-value fs-6 fw-bold" id="infoProgram">-</span>
                            </div>

                            <div class="info-item py-2">
                                <span class="info-label fs-6">Viti Akademik</span>
                                <span class="info-value fs-6 fw-bold" id="infoViti">1</span>
                            </div>

                            <div class="info-item py-2">
                                <span class="info-label fs-6">Kredite te Fituara</span>
                                <span class="info-value fs-6 fw-bold" id="infoKredite">0</span>
                            </div>

                            <div class="info-item highlight-item py-2">
                                <span class="info-label fs-6">Mesatarja e Ponderuar</span>
                                <span class="info-value fs-5 fw-bold" id="infoMesatarja">0.00</span>
                            </div>

                        </div>

                    </div>

                </div>

            </main>

        </div>

    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const _jwt = localStorage.getItem('jwtToken'); const _h = _jwt ? { 'Authorization': 'Bearer ' + _jwt } : {};
        $(document).ready(function () {
            loadStudentProfile();
        });

        async function loadStudentProfile() {
            const userId = localStorage.getItem('userId');
            const userEmail = localStorage.getItem('userEmail');

            let url = '/api/student/me';
            const params = [];
            if (userId) params.push('userId=' + encodeURIComponent(userId));
            if (userEmail) params.push('email=' + encodeURIComponent(userEmail));
            if (params.length > 0) url += '?' + params.join('&');

            try {
                const response = await fetch(url, { headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('jwtToken') || '') } });
                if (response.ok) {
                    const data = await response.json();

                    // 1. Header User Info
                    if (data.emriMbiemri && data.emriMbiemri !== '-') {
                        $('#headerStudentName').text(data.emriMbiemri);
                        $('#cardStudentName').text(data.emriMbiemri);
                    }
                    if (data.programiStudimit && data.programiStudimit !== '-') {
                        $('#headerStudentProgram').text(data.programiStudimit);
                        $('#infoProgram').text(data.programiStudimit);
                    }

                    // 2. Profile Details
                    $('#cardMatrikulli').text(data.nrMatrikulimit || '-');
                    $('#infoViti').text(data.vitiAkademik || '1');
                    $('#infoKredite').text(data.totalKredite !== null && data.totalKredite !== undefined ? data.totalKredite : 0);
                    $('#infoMesatarja').text(data.mesatarjaFormatted || '0.00');
                }
            } catch (err) {
                console.error("Gabim gjate marrjes te te dhenave te studentit:", err);
            }
        }
    </script>
</body>

</html>
