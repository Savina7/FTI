<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <title>Class Diagram - Sistemi Akademik FTI</title>
  <style>
    body {
      margin: 0;
      padding: 30px;
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .header {
      text-align: center;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 24px;
      color: #38bdf8;
    }
    p {
      margin: 0;
      color: #94a3b8;
      font-size: 14px;
    }
    .actions {
      display: flex;
      gap: 12px;
      margin-bottom: 10px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #2563eb;
      color: white;
    }
    .btn-primary:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }
    .btn-dark {
      background: #334155;
      color: white;
    }
    .btn-dark:hover {
      background: #475569;
      transform: translateY(-1px);
    }
    .container {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
      max-width: 1360px;
      width: 100%;
      box-sizing: border-box;
      overflow-x: auto;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      background: white;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>UML Class Diagram: Sistemi Akademik FTI</h1>
    <p>Diagrami i klasave me të gjitha entitetet, atributet, metodat dhe marrëdhëniet</p>
  </div>

  <div class="actions">
    <button class="btn btn-primary" onclick="downloadPng()">📥 Shkarko si PNG (High-Res)</button>
    <a href="class_diagram.svg" download="Class_Diagram_FTI.svg" class="btn btn-dark">💾 Shkarko si SVG</a>
  </div>

  <div class="container">
    <img id="diagramImg" src="class_diagram.svg" alt="Class Diagram - Sistemi Akademik FTI">
  </div>

  <canvas id="exportCanvas" style="display: none;"></canvas>

  <script>
    function downloadPng() {
      const img = new Image();
      img.onload = function() {
        const canvas = document.getElementById('exportCanvas');
        const scale = 2.5;
        canvas.width = 1800 * scale;
        canvas.height = 1100 * scale;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        
        const a = document.createElement('a');
        a.download = 'Class_Diagram_FTI.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      };
      img.src = 'class_diagram.svg';
    }
  </script>
</body>
</html>
