<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>

    <linearGradient id="avatarHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="avatarBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="dbTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>

    <style>
      text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 800; fill: #000000; text-anchor: middle; letter-spacing: -0.5px; }
      .dotted-box { fill: #f8fafc; stroke: #0f172a; stroke-width: 1.8; stroke-dasharray: 5, 4; }
      .box-header { font-size: 20px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .white-card { fill: #ffffff; stroke: #0f172a; stroke-width: 1.6; rx: 2; }
      .card-stack { fill: #f1f5f9; stroke: #0f172a; stroke-width: 1.4; rx: 2; }
      .service-pill { fill: #fefce8; stroke: #fef08a; stroke-width: 1.4; rx: 6; }
      .service-txt { font-size: 13.5px; font-weight: 600; fill: #475569; text-anchor: middle; }
      .lb-diamond { fill: #475569; stroke: #0f172a; stroke-width: 1.5; }
      .arrow-line { stroke: #1e293b; stroke-width: 2.2; fill: none; }
      .principle-title { font-size: 22px; font-weight: 800; fill: #0f172a; }
      .principle-item { font-size: 15px; font-weight: 700; fill: #1e293b; }
      .dot { font-size: 20px; fill: #ea580c; font-weight: 900; }
      .client-label { font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .client-sub { font-size: 11px; font-weight: 700; fill: #475569; text-anchor: middle; }
    </style>
  </defs>

  <!-- Clean Pure White Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Main Title -->
  <text x="600" y="68" class="title">Layered Architecture</text>

  <!-- 1. LEFT SIDE: CLIENTS -->
  <!-- Client 1: Student (Top) -->
  <g transform="translate(130, 155)">
    <circle cx="20" cy="-6" r="14" fill="url(#avatarHead)"/>
    <path d="M 0,28 C 0,10 40,10 40,28 Z" fill="url(#avatarBody)"/>
    <text x="20" y="24" class="client-label">Client</text>
    <text x="20" y="44" class="client-sub">Student</text>
  </g>

  <!-- Client 2: Professor (Middle) -->
  <g transform="translate(50, 310)">
    <circle cx="20" cy="-6" r="14" fill="url(#avatarHead)"/>
    <path d="M 0,28 C 0,10 40,10 40,28 Z" fill="url(#avatarBody)"/>
    <text x="20" y="24" class="client-label">Client</text>
    <text x="20" y="44" class="client-sub">Professor</text>
  </g>

  <!-- Client 3: Admin (Bottom) -->
  <g transform="translate(130, 465)">
    <circle cx="20" cy="-6" r="14" fill="url(#avatarHead)"/>
    <path d="M 0,28 C 0,10 40,10 40,28 Z" fill="url(#avatarBody)"/>
    <text x="20" y="24" class="client-label">Client</text>
    <text x="20" y="44" class="client-sub">Admin</text>
  </g>

  <!-- 2. LOAD BALANCER (Diamond) -->
  <g transform="translate(225, 325)">
    <path d="M 0,-44 L 44,0 L 0,44 L -44,0 Z" class="lb-diamond"/>
    <text x="0" y="-4" fill="#ffffff" style="font-size: 12.5px; font-weight: 700;" text-anchor="middle">Load</text>
    <text x="0" y="12" fill="#ffffff" style="font-size: 12.5px; font-weight: 700;" text-anchor="middle">Balancer</text>
  </g>

  <!-- Arrows from Clients to Load Balancer -->
  <path d="M 175, 175 L 225, 175 L 225, 273" class="arrow-line" marker-end="url(#arrow)"/>
  <path d="M 95, 325 L 173, 325" class="arrow-line" marker-end="url(#arrow)"/>
  <path d="M 175, 485 L 225, 485 L 225, 377" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Arrow from Load Balancer to Frontend UI -->
  <path d="M 270, 325 L 368, 325" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- 3. MIDDLE DOTTED BOX: FRONTEND & BACKEND -->
  <!-- FRONTEND DOTTED CONTAINER -->
  <rect x="330" y="140" width="180" height="430" class="dotted-box"/>
  <g transform="translate(420, 175)">
    <circle cx="-52" cy="-6" r="3" fill="#0f172a"/>
    <text x="0" y="0" class="box-header">Frontend</text>
  </g>

  <!-- BACKEND DOTTED CONTAINER -->
  <rect x="510" y="140" width="310" height="430" class="dotted-box"/>
  <g transform="translate(665, 175)">
    <circle cx="-50" cy="-6" r="3" fill="#0f172a"/>
    <text x="0" y="0" class="box-header">Backend</text>
  </g>

  <!-- FRONTEND CARD: UI Stacked Cards -->
  <rect x="382" y="222" width="100" height="315" class="card-stack"/>
  <rect x="368" y="232" width="100" height="315" class="white-card"/>
  <text x="418" y="395" style="font-size: 28px; font-weight: 800; fill: #0f172a;" text-anchor="middle">UI</text>
  <text x="418" y="425" style="font-size: 11.5px; font-weight: 600; fill: #64748b;" text-anchor="middle">(Thymeleaf)</text>

  <!-- Arrow from UI to Backend Logic -->
  <path d="M 488, 370 L 550, 370" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- BACKEND CARD: Logic Stacked Cards with Services -->
  <rect x="566" y="222" width="225" height="325" class="card-stack"/>
  <rect x="552" y="232" width="225" height="325" class="white-card"/>
  
  <text x="664" y="270" style="font-size: 22px; font-weight: 800; fill: #0f172a;" text-anchor="middle">Logic</text>

  <!-- Services -->
  <rect x="580" y="290" width="170" height="38" class="service-pill"/>
  <text x="665" y="314" class="service-txt">Schedule Service</text>

  <rect x="580" y="340" width="170" height="38" class="service-pill"/>
  <text x="665" y="364" class="service-txt">Student Service</text>

  <rect x="580" y="390" width="170" height="38" class="service-pill"/>
  <text x="665" y="414" class="service-txt">Pedagog Service</text>

  <rect x="580" y="440" width="170" height="38" class="service-pill"/>
  <text x="665" y="464" class="service-txt">Exam Service</text>

  <rect x="580" y="490" width="170" height="38" class="service-pill"/>
  <text x="665" y="514" class="service-txt">Auth Service</text>

  <!-- Arrow from Backend to RDBMS -->
  <path d="M 792, 430 L 890, 430" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- 4. RIGHT SIDE: PRINCIPLES -->
  <g transform="translate(860, 175)">
    <text x="0" y="0" class="principle-title">Principles</text>
    
    <g transform="translate(5, 34)">
      <circle cx="2" cy="-4" r="3" fill="#ea580c"/>
      <text x="14" y="-1" class="principle-item">KISS</text>
    </g>

    <g transform="translate(5, 64)">
      <circle cx="2" cy="-4" r="3" fill="#ea580c"/>
      <text x="14" y="-1" class="principle-item">YAGNI</text>
    </g>

    <g transform="translate(5, 94)">
      <circle cx="2" cy="-4" r="3" fill="#ea580c"/>
      <text x="14" y="-1" class="principle-item">SoC</text>
    </g>

    <g transform="translate(5, 124)">
      <circle cx="2" cy="-4" r="3" fill="#ea580c"/>
      <text x="14" y="-1" class="principle-item">SOLID</text>
    </g>

    <g transform="translate(5, 154)">
      <circle cx="2" cy="-4" r="3" fill="#ea580c"/>
      <text x="14" y="-1" class="principle-item">DRY</text>
    </g>
  </g>

  <!-- 5. DATABASE: ORACLE RDBMS -->
  <g transform="translate(900, 380)">
    <path d="M 0,20 L 0,75 C 0,92 110,92 110,75 L 110,20 Z" fill="url(#dbGrad)" stroke="#ea580c" stroke-width="1.6"/>
    <ellipse cx="55" cy="20" rx="55" ry="16" fill="url(#dbTopGrad)" stroke="#ea580c" stroke-width="1.6"/>
    <text x="55" y="58" style="font-size: 15px; font-weight: 900; fill: #ffffff; letter-spacing: 0.5px;" text-anchor="middle">Oracle</text>
    <text x="55" y="74" style="font-size: 12px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px;" text-anchor="middle">RDBMS</text>
  </g>

</svg>