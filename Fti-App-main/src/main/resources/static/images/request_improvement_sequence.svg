<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" width="100%" height="100%">
  <defs>
    <!-- Filter for soft modern shadow -->
    <filter id="boxShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <!-- Solid Arrowhead for Synchronous Messages -->
    <marker id="solid-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polygon points="0,1 9,5 0,9" fill="#991b1b"/>
    </marker>

    <!-- Open Arrowhead for Return Messages -->
    <marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polyline points="1,1 9,5 1,9" fill="none" stroke="#991b1b" stroke-width="1.8" stroke-linecap="round"/>
    </marker>

    <!-- Stick figure template for Actor -->
    <g id="actor-stick">
      <circle cx="0" cy="-22" r="10" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
      <line x1="0" y1="-12" x2="0" y2="10" stroke="#1e293b" stroke-width="2"/>
      <line x1="-15" y1="-4" x2="15" y2="-4" stroke="#1e293b" stroke-width="2"/>
      <line x1="0" y1="10" x2="-10" y2="28" stroke="#1e293b" stroke-width="2"/>
      <line x1="0" y1="10" x2="10" y2="28" stroke="#1e293b" stroke-width="2"/>
    </g>

    <style>
      text { 
        font-family: 'Segoe UI', Arial, sans-serif; 
        font-style: normal; 
      }
      .participant-box { fill: #fef08a; stroke: #ca8a04; stroke-width: 1.8; rx: 8; ry: 8; filter: url(#boxShadow); }
      .participant-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #1e293b; font-style: normal; text-anchor: middle; dominant-baseline: middle; }
      .lifeline { stroke: #b91c1c; stroke-width: 1.6; stroke-dasharray: 6,5; }
      .activation-box { fill: #fef9c3; stroke: #ca8a04; stroke-width: 1.6; rx: 3; }
      .msg-line { stroke: #991b1b; stroke-width: 1.6; marker-end: url(#solid-arrow); }
      .ret-line { stroke: #991b1b; stroke-width: 1.6; stroke-dasharray: 5,4; marker-end: url(#return-arrow); }
      .self-line { stroke: #991b1b; stroke-width: 1.6; fill: none; marker-end: url(#solid-arrow); }
      
      /* UNIFIED: EXACT SAME FONT, SIZE (12px), COLOR (#1e293b), WEIGHT (600), NO ITALIC */
      .msg-text, .ret-text, .self-text {
        font-family: 'Segoe UI', Arial, sans-serif;
        font-size: 12px;
        font-weight: 600;
        fill: #1e293b;
        font-style: normal;
      }

      /* Clean Divider Lines */
      .branch-divider { stroke: #475569; stroke-width: 1.4; stroke-dasharray: 6,4; }
      .branch-badge { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.2; rx: 4; }
      .branch-text-success { font-size: 12px; font-weight: 700; fill: #0369a1; text-anchor: middle; }
      .branch-text-error { font-size: 12px; font-weight: 700; fill: #b91c1c; text-anchor: middle; }
    </style>
  </defs>

  <!-- PURE WHITE BACKGROUND (NO GRID) -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ========================================================================= -->
  <!-- LIFELINE COLUMNS (X Coordinates)                                          -->
  <!-- Student: 100 | Frontend: 340 | Server: 600 | Database: 860                -->
  <!-- ========================================================================= -->

  <!-- Lifelines (Vertical dashed lines) -->
  <line x1="100" y1="105" x2="100" y2="825" class="lifeline"/>
  <line x1="340" y1="105" x2="340" y2="825" class="lifeline"/>
  <line x1="600" y1="105" x2="600" y2="825" class="lifeline"/>
  <line x1="860" y1="105" x2="860" y2="825" class="lifeline"/>

  <!-- ========================================================================= -->
  <!-- TOP PARTICIPANT HEADERS                                                   -->
  <!-- ========================================================================= -->
  <!-- Student (Actor + Box) -->
  <g transform="translate(100, 42)">
    <use href="#actor-stick" transform="scale(0.85) translate(0, -5)"/>
    <rect x="-48" y="22" width="96" height="34" class="participant-box"/>
    <text x="0" y="39" class="participant-title">Student</text>
  </g>

  <!-- Frontend (Web UI) -->
  <g transform="translate(340, 68)">
    <rect x="-65" y="-18" width="130" height="36" class="participant-box"/>
    <text x="0" y="0" class="participant-title">Frontend</text>
  </g>

  <!-- Server (Spring Boot) -->
  <g transform="translate(600, 68)">
    <rect x="-60" y="-18" width="120" height="36" class="participant-box"/>
    <text x="0" y="0" class="participant-title">Server</text>
  </g>

  <!-- Database (Oracle DB) -->
  <g transform="translate(860, 68)">
    <rect x="-65" y="-18" width="130" height="36" class="participant-box"/>
    <text x="0" y="0" class="participant-title">Database</text>
  </g>

  <!-- ========================================================================= -->
  <!-- ACTIVATION BOXES (EXECUTION FOCUS)                                        -->
  <!-- ========================================================================= -->
  <!-- Frontend active during interaction -->
  <rect x="333" y="145" width="14" height="640" class="activation-box"/>
  <!-- Server active during request processing -->
  <rect x="593" y="215" width="14" height="510" class="activation-box"/>
  <!-- Database active during read and write operations -->
  <rect x="853" y="265" width="14" height="60" class="activation-box"/>
  <rect x="853" y="455" width="14" height="60" class="activation-box"/>

  <!-- ========================================================================= -->
  <!-- MESSAGES FLOW                                                             -->
  <!-- ========================================================================= -->

  <!-- 1. Student clicks on grade to request improvement -->
  <line x1="100" y1="145" x2="333" y2="145" class="msg-line"/>
  <text x="216" y="138" class="msg-text" text-anchor="middle">1: Click grade to improve</text>

  <!-- 2. Student confirms in modal -->
  <line x1="100" y1="185" x2="333" y2="185" class="msg-line"/>
  <text x="216" y="178" class="msg-text" text-anchor="middle">2: Click "Konfirmo" in modal</text>

  <!-- 3. Frontend sends POST request to Server with JWT -->
  <line x1="347" y1="225" x2="593" y2="225" class="msg-line"/>
  <text x="470" y="206" class="msg-text" text-anchor="middle">3: POST /api/student/improvement</text>
  <text x="470" y="219" class="msg-text" text-anchor="middle">(courseId, isImprovement=true + JWT)</text>

  <!-- 4. Server queries Database for student grades -->
  <line x1="607" y1="275" x2="853" y2="275" class="msg-line"/>
  <text x="730" y="257" class="msg-text" text-anchor="middle">4: Find student grades</text>
  <text x="730" y="270" class="msg-text" text-anchor="middle">(gradeRepo.findByStudent...)</text>

  <!-- 5. Database returns student grades -->
  <line x1="853" y1="315" x2="607" y2="315" class="ret-line"/>
  <text x="730" y="308" class="ret-text" text-anchor="middle">5: Return student grades</text>

  <!-- 6. Server self-validation: checks passing grade (>=5) and max 2 improvements -->
  <path d="M 607,345 C 655,345 655,375 609,375" class="self-line"/>
  <text x="660" y="355" class="self-text">6: Validate grade (&gt;= 5) &amp;</text>
  <text x="660" y="370" class="self-text">check limit (&lt; 2) (self-call)</text>

  <!-- ========================================================================= -->
  <!-- BRANCH 1: SUCCESS (Only between Server and Database)                       -->
  <!-- ========================================================================= -->
  <line x1="615" y1="406" x2="710" y2="406" class="branch-divider"/>
  <line x1="615" y1="410" x2="710" y2="410" class="branch-divider"/>
  <text x="730" y="412" style="font-size: 13px; font-weight: 700; fill: #0369a1;" text-anchor="middle">alt</text>
  <line x1="750" y1="406" x2="845" y2="406" class="branch-divider"/>
  <line x1="750" y1="410" x2="845" y2="410" class="branch-divider"/>
  <text x="730" y="428" class="branch-text-success">[ Grade &gt;= 5 and active improvements &lt; 2 ]</text>

  <!-- 7. Server updates grade status in Database -->
  <line x1="607" y1="465" x2="853" y2="465" class="msg-line"/>
  <text x="730" y="447" class="msg-text" text-anchor="middle">7: Update grade status to "IMPROVED"</text>
  <text x="730" y="460" class="msg-text" text-anchor="middle">(gradeRepo.save)</text>

  <!-- 8. Database confirms persistence -->
  <line x1="853" y1="505" x2="607" y2="505" class="ret-line"/>
  <text x="730" y="498" class="ret-text" text-anchor="middle">8: Grade updated (commit OK)</text>

  <!-- 9. Server returns HTTP 200 Success Response -->
  <line x1="593" y1="555" x2="347" y2="555" class="ret-line"/>
  <text x="470" y="537" class="ret-text" text-anchor="middle">9: HTTP 200 OK</text>
  <text x="470" y="550" class="ret-text" text-anchor="middle">{"success": true, "message": "Kerkesa u dergua me sukses."}</text>

  <!-- 10. Frontend displays success toast to Student -->
  <line x1="333" y1="615" x2="100" y2="615" class="ret-line"/>
  <text x="216" y="597" class="ret-text" text-anchor="middle">10: Show success toast</text>
  <text x="216" y="610" class="ret-text" text-anchor="middle">("Kerkesa per permiresim u regjistrua me sukses!")</text>

  <!-- ========================================================================= -->
  <!-- BRANCH 2: ERROR (else)                                                    -->
  <!-- ========================================================================= -->
  <line x1="615" y1="662" x2="710" y2="662" class="branch-divider"/>
  <line x1="615" y1="666" x2="710" y2="666" class="branch-divider"/>
  <text x="730" y="668" style="font-size: 13px; font-weight: 700; fill: #b91c1c;" text-anchor="middle">else</text>
  <line x1="750" y1="662" x2="845" y2="662" class="branch-divider"/>
  <line x1="750" y1="666" x2="845" y2="666" class="branch-divider"/>
  <text x="730" y="684" class="branch-text-error">[ else (Grade &lt; 5 or active improvements &gt;= 2) ]</text>

  <!-- 11. Server returns HTTP 400 Bad Request -->
  <line x1="593" y1="715" x2="347" y2="715" class="ret-line"/>
  <text x="470" y="697" class="ret-text" text-anchor="middle">11: HTTP 400 Bad Request</text>
  <text x="470" y="710" class="ret-text" text-anchor="middle">{"message": "Nuk lejohet permiresimi..."}</text>

  <!-- 12. Frontend displays error toast to Student -->
  <line x1="333" y1="775" x2="100" y2="775" class="ret-line"/>
  <text x="216" y="757" class="ret-text" text-anchor="middle">12: Show error toast</text>
  <text x="216" y="770" class="ret-text" text-anchor="middle">(display error message)</text>

  <!-- ========================================================================= -->
  <!-- BOTTOM PARTICIPANT BOXES                                                  -->
  <!-- ========================================================================= -->
  <!-- Student Bottom -->
  <g transform="translate(100, 840)">
    <rect x="-48" y="-17" width="96" height="34" class="participant-box"/>
    <text x="0" y="0" class="participant-title">Student</text>
  </g>

  <!-- Frontend Bottom -->
  <g transform="translate(340, 840)">
    <rect x="-65" y="-17" width="130" height="34" class="participant-box"/>
    <text x="0" y="0" class="participant-title">Frontend</text>
  </g>

  <!-- Server Bottom -->
  <g transform="translate(600, 840)">
    <rect x="-60" y="-18" width="120" height="34" class="participant-box"/>
    <text x="0" y="0" class="participant-title">Server</text>
  </g>

  <!-- Database Bottom -->
  <g transform="translate(860, 840)">
    <rect x="-65" y="-17" width="130" height="34" class="participant-box"/>
    <text x="0" y="0" class="participant-title">Database</text>
  </g>

</svg>
