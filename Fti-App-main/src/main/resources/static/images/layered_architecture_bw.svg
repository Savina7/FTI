<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 620" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000"/>
    </marker>

    <style>
      text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif; }
      .title { font-size: 32px; font-weight: 800; fill: #000000; text-anchor: middle; letter-spacing: -0.5px; }
      
      .dotted-box { fill: #ffffff; stroke: #000000; stroke-width: 1.8; stroke-dasharray: 6, 5; }
      .box-header { font-size: 19px; font-weight: 800; fill: #000000; text-anchor: middle; }
      
      .white-card { fill: #ffffff; stroke: #000000; stroke-width: 1.8; rx: 3; }
      .card-stack { fill: #f8fafc; stroke: #000000; stroke-width: 1.5; rx: 3; }
      
      .layer-title { font-size: 18px; font-weight: 800; fill: #000000; text-anchor: middle; }
      
      .pill-box { fill: #ffffff; stroke: #000000; stroke-width: 1.3; rx: 5; }
      .pill-txt { font-size: 13px; font-weight: 600; fill: #000000; text-anchor: middle; }
      
      .lb-diamond { fill: #ffffff; stroke: #000000; stroke-width: 1.8; }
      .arrow-line { stroke: #000000; stroke-width: 2; fill: none; }
      
      .client-stroke { fill: #ffffff; stroke: #000000; stroke-width: 1.8; }
      .client-txt { font-size: 13px; font-weight: 700; fill: #000000; text-anchor: middle; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="630" y="55" class="title">Layered Architecture</text>

  <!-- Client 1 (Top) -->
  <g transform="translate(65, 140)">
    <circle cx="20" cy="-6" r="14" class="client-stroke"/>
    <path d="M -2,32 C -2,12 42,12 42,32 Z" class="client-stroke"/>
    <text x="20" y="50" class="client-txt">Client</text>
  </g>

  <!-- Client 2 (Middle) -->
  <g transform="translate(15, 290)">
    <circle cx="20" cy="-6" r="14" class="client-stroke"/>
    <path d="M -2,32 C -2,12 42,12 42,32 Z" class="client-stroke"/>
    <text x="20" y="50" class="client-txt">Client</text>
  </g>

  <!-- Client 3 (Bottom) -->
  <g transform="translate(65, 440)">
    <circle cx="20" cy="-6" r="14" class="client-stroke"/>
    <path d="M -2,32 C -2,12 42,12 42,32 Z" class="client-stroke"/>
    <text x="20" y="50" class="client-txt">Client</text>
  </g>

  <!-- Load Balancer Diamond -->
  <g transform="translate(160, 310)">
    <path d="M 0,-42 L 42,0 L 0,42 L -42,0 Z" class="lb-diamond"/>
    <text x="0" y="-4" fill="#000000" style="font-size: 12px; font-weight: 700;" text-anchor="middle">Load</text>
    <text x="0" y="12" fill="#000000" style="font-size: 12px; font-weight: 700;" text-anchor="middle">Balancer</text>
  </g>

  <!-- Lines to Load Balancer -->
  <path d="M 112, 165 L 160, 165 L 160, 260" class="arrow-line" marker-end="url(#arrow)"/>
  <path d="M 62, 310 L 110, 310" class="arrow-line" marker-end="url(#arrow)"/>
  <path d="M 112, 465 L 160, 465 L 160, 360" class="arrow-line" marker-end="url(#arrow)"/>
  <path d="M 205, 310 L 255, 310" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Frontend Box -->
  <rect x="240" y="115" width="165" height="440" class="dotted-box"/>
  <text x="322" y="150" class="box-header">Frontend</text>

  <!-- UI Card -->
  <rect x="277" y="185" width="100" height="340" class="card-stack"/>
  <rect x="265" y="195" width="100" height="340" class="white-card"/>
  <text x="315" y="370" style="font-size: 28px; font-weight: 800; fill: #000000;" text-anchor="middle">UI</text>

  <!-- Arrow UI to Backend -->
  <path d="M 370, 365 L 435, 365" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Backend Box -->
  <rect x="425" y="115" width="560" height="440" class="dotted-box"/>
  <text x="705" y="150" class="box-header">Backend</text>

  <!-- Controllers Layer Card -->
  <rect x="455" y="185" width="225" height="340" class="card-stack"/>
  <rect x="443" y="195" width="225" height="340" class="white-card"/>
  <text x="555" y="235" class="layer-title">Controllers</text>

  <rect x="465" y="260" width="180" height="42" class="pill-box"/>
  <text x="555" y="286" class="pill-txt">Auth Controller</text>

  <rect x="465" y="315" width="180" height="42" class="pill-box"/>
  <text x="555" y="341" class="pill-txt">Student Controller</text>

  <rect x="465" y="370" width="180" height="42" class="pill-box"/>
  <text x="555" y="396" class="pill-txt">Pedagog Controller</text>

  <rect x="465" y="425" width="180" height="42" class="pill-box"/>
  <text x="555" y="451" class="pill-txt">Schedule Controller</text>

  <rect x="465" y="480" width="180" height="42" class="pill-box"/>
  <text x="555" y="506" class="pill-txt">Exam Controller</text>

  <!-- Arrow Controllers to Services (Clean spacing) -->
  <path d="M 675, 365 L 725, 365" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Services Layer Card -->
  <rect x="735" y="185" width="225" height="340" class="card-stack"/>
  <rect x="723" y="195" width="225" height="340" class="white-card"/>
  <text x="835" y="235" class="layer-title">Services</text>

  <rect x="745" y="260" width="180" height="42" class="pill-box"/>
  <text x="835" y="286" class="pill-txt">Auth Service</text>

  <rect x="745" y="315" width="180" height="42" class="pill-box"/>
  <text x="835" y="341" class="pill-txt">Student Service</text>

  <rect x="745" y="370" width="180" height="42" class="pill-box"/>
  <text x="835" y="396" class="pill-txt">Pedagog Service</text>

  <rect x="745" y="425" width="180" height="42" class="pill-box"/>
  <text x="835" y="451" class="pill-txt">Schedule Service</text>

  <rect x="745" y="480" width="180" height="42" class="pill-box"/>
  <text x="835" y="506" class="pill-txt">Exam Service</text>

  <!-- Arrow Services to Database -->
  <path d="M 955, 365 L 1060, 365" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Database RDBMS -->
  <g transform="translate(1070, 320)">
    <path d="M 0,20 L 0,75 C 0,92 110,92 110,75 L 110,20 Z" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <ellipse cx="55" cy="20" rx="55" ry="16" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="55" y="62" style="font-size: 16px; font-weight: 800; fill: #000000; letter-spacing: 0.5px;" text-anchor="middle">RDBMS</text>
  </g>

</svg>